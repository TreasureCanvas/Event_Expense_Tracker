<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Expense Tracker · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    --brand:#FE6D43; --brand-text:#B4451F; --brand-soft:#FFF1E8;
    --ink:#1E1E1E; --muted:#5F5F5A; --line:#D9D9D6; --fill:#ECECE8; --bg:#F5F5F3; --surface:#FFFFFF;
    --ok:#1B6B3C; --ok-bg:#E3F4E8; --warn:#8A4B00; --warn-bg:#FFF1DE; --err:#A61B1B; --err-bg:#FDECEC; --info-bg:#EDEDEA;
    background:var(--bg);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Thai',system-ui,sans-serif; font-size:15px; line-height:1.55;}
  a{color:var(--brand-text);} a:hover{color:#8A3416;}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .muted{color:var(--muted);} .small{font-size:13px;} .grow{flex:1 1 0;}
  .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .between{justify-content:space-between;}
  .ic{fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none;}

  .topbar{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:21; background:var(--surface);}
  .topbar-in{max-width:1200px; margin:0 auto; padding:12px 32px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; color:var(--ink); text-decoration:none;}
  .brand-mark{width:28px; height:28px; border-radius:8px; background:var(--brand);}
  .brand small{font-weight:400; color:var(--muted); font-size:14px;}
  .nav{display:flex; gap:4px; align-items:center; flex-wrap:wrap;}
  .nav a{padding:8px 12px; border-radius:8px; text-decoration:none; color:var(--ink); font-weight:600; font-size:14px;}
  .nav a.on{background:var(--bg);}
  main{max-width:1200px; margin:0 auto; padding:28px 32px 120px; display:flex; flex-direction:column; gap:20px;}
  .crumb{font-size:14px; color:var(--muted);}
  h1{margin:0; font-size:26px; line-height:1.3; overflow-wrap:anywhere;}
  h2{margin:0; font-size:18px;}
  h3{margin:0; font-size:16px;}
  .sub{margin:4px 0 0; color:var(--muted); overflow-wrap:anywhere;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:16px; min-width:0;}
  .card.dashed{border-style:dashed;}

  label{font-size:14px; font-weight:600;}
  .req{color:var(--err);}
  input:not([type=checkbox]):not([type=file]), select, textarea{font:inherit; color:var(--ink); width:100%; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:15px;}
  textarea{padding:12px; min-height:120px; line-height:1.7; resize:vertical;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 1px var(--ink);}
  input.invalid{border:2px solid var(--err) !important; box-shadow:none;}
  input.warn{border:2px solid var(--warn) !important;}
  input[type=checkbox]{width:18px; height:18px; accent-color:var(--brand); margin:0; flex:none;}
  .fld{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .fld-err{color:var(--err); font-size:13px;}
  .hint{font-size:13px; color:var(--muted);}
  .grid{display:grid; gap:16px;} .g2{grid-template-columns:repeat(2,minmax(0,1fr));} .g3{grid-template-columns:repeat(3,minmax(0,1fr));} .g4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .span2{grid-column:1 / -1;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; text-decoration:none;}
  .btn:hover{border-color:var(--ink);}
  .btn:disabled{opacity:.55; cursor:default;}
  .btn-primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn-primary:hover:not(:disabled){background:#E85A31; border-color:#E85A31;}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--bg); border-color:transparent;}
  .btn-danger{color:var(--err); border-color:transparent; background:transparent;}
  .btn-danger-solid{color:var(--err); border-color:var(--err); background:transparent;}
  .btn-dark{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn-sm{min-height:36px; padding:0 12px;}
  .btn-reset{color:var(--brand-text); border-color:var(--brand);}
  .btn-reset:hover:not(:disabled){background:var(--brand-soft); border-color:var(--brand);}
  .btn-reset:disabled{color:var(--muted); border-color:var(--line); opacity:1;}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; background:var(--info-bg); color:#4F4F4A;}
  .chip.ok{background:var(--ok-bg); color:var(--ok);} .chip.warn{background:var(--warn-bg); color:var(--warn);} .chip.err{background:var(--err-bg); color:var(--err);} .chip.acc{background:var(--brand-soft); color:var(--brand-text);}
  button.chip{border:1px solid transparent; cursor:pointer; min-height:36px; padding:0 14px; font:inherit; font-size:14px; font-weight:600;}
  button.chip.on{background:var(--ink); color:#fff;}

  .banner{border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; overflow-wrap:anywhere;}
  .banner.err{background:var(--err-bg); color:var(--err);} .banner.warn{background:var(--warn-bg); color:var(--warn);} .banner.info{background:var(--info-bg);} .banner.ok{background:var(--ok-bg); color:var(--ok);}
  .banner ul{margin:4px 0 0; padding-left:20px;}
  .banner a{color:inherit;}

  .ev-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; gap:20px; align-items:center; flex-wrap:wrap;}
  .ev-main{flex:1 1 360px; min-width:0; display:flex; flex-direction:column; gap:4px;}
  .ev-name{font-size:17px; font-weight:700; color:var(--ink); text-decoration:none; overflow-wrap:anywhere;}
  .ev-name:hover{text-decoration:underline;}
  .ev-amt{flex:0 0 150px; text-align:right;}
  .ev-amt b{font-size:18px;}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface);}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{text-align:left; padding:10px 12px; font-size:13px; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:10px 12px; border-bottom:1px solid #EEEEEA; vertical-align:middle; overflow-wrap:anywhere;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; white-space:nowrap;}
  tr.is-new td{background:#F6FBF7;}

  .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:2px; min-width:0;}
  .stat b{font-size:24px;}
  .selbar{background:var(--ink); color:#fff; border-radius:12px; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .selbar .btn{background:transparent; color:#fff; border-color:#6b6b66;}
  .selbar .btn:hover{border-color:#fff;}
  .savebar{position:sticky; bottom:0; z-index:10; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; box-shadow:0 -2px 10px rgba(0,0,0,.06); margin-bottom:env(safe-area-inset-bottom,0px);}
  .draft-ok{color:var(--ok); font-weight:600;}
  .thumb{width:64px; height:64px; border-radius:8px; border:1px solid var(--line); background:var(--fill); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); flex:none; position:relative;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .file-btn{display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 12px; border:1.5px dashed #BDBDB7; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; background:var(--surface);}
  .file-btn input{position:absolute; width:1px; height:1px; opacity:0;}
  .skel{height:14px; border-radius:6px; background:var(--fill);}

  .drawer-wrap{position:fixed; inset:0; z-index:50; display:flex; justify-content:flex-end; background:rgba(20,20,20,.35);}
  .drawer{width:620px; max-width:100%; height:100%; overflow-y:auto; background:var(--surface); box-shadow:-8px 0 24px rgba(0,0,0,.12); padding:28px; padding-top:calc(28px + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:16px;}
  .day-sec{border-top:1px solid var(--line); padding-top:4px; display:flex; flex-direction:column; gap:10px;}
  .day-toggle{width:100%; min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 4px; border:none; background:transparent; font:inherit; color:var(--ink); text-align:left; cursor:pointer;}
  .mini td{padding:8px 10px;}
  .mini .grp td{background:var(--bg); font-weight:700; font-size:13px;}
  .ev-grid{display:flex; gap:12px; flex-wrap:wrap;}
  .ev-fig{margin:0; width:96px; display:flex; flex-direction:column; gap:4px;}
  .ev-fig .ph{width:96px; height:96px; border-radius:8px; background:var(--fill); border:1px dashed #BDBDB7; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted);}
  .ev-fig figcaption{font-size:12px; color:var(--muted); line-height:1.35;}
  .hist{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #EEEEEA; flex-wrap:wrap;}

  .modal-overlay{position:fixed; inset:0; z-index:100; background:rgba(20,20,20,.45); display:flex; align-items:flex-start; justify-content:center; padding:80px 20px 20px; overflow:auto;}
  .modal{width:100%; max-width:480px; background:var(--surface); border-radius:14px; padding:28px; box-shadow:0 16px 40px rgba(0,0,0,.25); display:flex; flex-direction:column; gap:14px;}
  .modal.wide{max-width:860px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;}
  .steps{display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:14px;}
  .step{display:inline-flex; align-items:center; gap:8px; color:var(--muted);}
  .step i{font-style:normal; width:24px; height:24px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:var(--fill);}
  .step.on{color:var(--ink); font-weight:700;} .step.on i{background:var(--brand); color:#fff;}
  .step.done{color:var(--ink);} .step.done i{background:var(--ink); color:#fff;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); z-index:120; display:flex; align-items:center; gap:16px; background:var(--ink); color:#fff; border-radius:12px; padding:12px 16px; box-shadow:0 12px 32px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:calc(100vw - 32px); margin-bottom:env(safe-area-inset-bottom,0px);}
  .toast.show{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0);}
  .toast button{min-height:36px; padding:0 14px; border-radius:8px; border:1px solid #fff; background:transparent; color:#fff; font:inherit; font-weight:700; cursor:pointer;}
  .login{max-width:420px; margin:72px auto; }


  @media (max-width: 760px){
    .topbar-in, main{padding-left:14px; padding-right:14px;}
    .g2, .g3, .g4{grid-template-columns:1fr;}
    .ev-amt{text-align:left; flex-basis:auto;}
    .card{padding:16px;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
  .lightbox{position:fixed; inset:0; z-index:150; background:rgba(0,0,0,.82); display:none; align-items:center; justify-content:center; padding:24px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:92vw; max-height:86vh; border-radius:8px; background:#fff;}
  .lightbox button{position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; min-height:44px; padding:0 16px; border-radius:10px; border:1px solid #fff; background:transparent; color:#fff; font:inherit; font-weight:700; cursor:pointer;}
  a.ph{display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--brand-text); font-weight:600;}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status"></div>
<div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLightbox()" role="dialog" aria-label="รูปขนาดเต็ม"><img alt=""><button type="button" onclick="closeLightbox()">ปิด ✕</button></div>
<script>
/* =====================================================================
   Event Expense Tracker — หน้า Admin (index.html)
   ⚠️ ใส่ Web App URL ของ Google Apps Script ที่บรรทัด API_URL ด้านล่าง
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwpocNSNrJea93nQsKLAZrYHhyHtBsgEpgo5E6t2L4zJyBN1jCj7yYq-D5kyt1ZwHE/exec';

const h = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = n => (Number(n) || 0).toLocaleString('th-TH', { minimumFractionDigits:2, maximumFractionDigits:2 });
const pad = n => String(n).padStart(2, '0');
const isoD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const iso = off => { const d = new Date(); d.setDate(d.getDate() + off); return isoD(d); };
const thDate = s => { if(!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric' }); };
const thDT = s => s ? thDate(s.split('T')[0]) + ' ' + (s.split('T')[1] || '') : '';
const safeName = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_');
const ICON = {
  clip: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" class="ic"><path d="M10.5 4.5 L5 10 a1.8 1.8 0 0 0 2.5 2.5 L13 7 a3.2 3.2 0 0 0 -4.5 -4.5 L3 8"></path></svg>',
  reset: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" class="ic"><path d="M2.5 3 V6.5 H6"></path><path d="M2.9 6.3 A5.5 5.5 0 1 1 3.4 10.6"></path></svg>'
};
const TYPE_LABELS = { BTS_GREEN:'BTS สายสีเขียว', BTS_GOLD:'BTS สายสีทอง', BTS_YELLOW:'MRT สายสีเหลือง', BTS_PINK:'MRT สายสีชมพู', MRT_BLUE:'MRT สีน้ำเงิน', MRT_PURPLE:'MRT สีม่วง',
  SRT_RED:'SRT สีแดง', ARL:'Airport Rail Link', CAR:'รถยนต์ส่วนบุคคล', TAXI:'แท็กซี่', GRAB:'Grab/Lineman/Bolt', MOTORCYCLE:'รถจักรยานยนต์รับจ้าง', PARKING:'ค่าจอดรถ',
  TOLL:'ค่าธรรมเนียมผ่านทางพิเศษ (ทางด่วน)', NO_CLAIM:'ไม่เบิกค่าเดินทาง', OTHER:'อื่นๆ' };
const typeLabel = s => s.type === 'OTHER' && s.otherDescription ? `อื่นๆ (${s.otherDescription})` : (TYPE_LABELS[s.type] || s.type || '-');

/* ---------- API ---------- */
function adminKey(){ try{ return localStorage.getItem('eetAdminKey') || ''; }catch(e){ return ''; } }
async function callApi(action, payload){
  const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload: payload || {}, adminKey: adminKey() }) });
  const data = await res.json();
  if(data && data.code === 'UNAUTHORIZED'){
    try{ localStorage.removeItem('eetAdminKey'); }catch(e){}
    viewLogin('รหัส Admin ถูกเปลี่ยนหรือไม่ถูกต้อง กรุณาใส่รหัสใหม่');
    throw new Error('UNAUTHORIZED');
  }
  return data;
}

/* ---------- state ---------- */
const UI = { q:'', filter:'all', rq:'', rfilter:'all', sel:new Set(), exportSel:new Set(), ex:{ q:'', from:'', to:'' }, form:null, openDays:{}, events:null, roster:null, drawer:null };

/* ---------- toast & modal ---------- */
let toastTimer = null;
function toast(text, action, fn, ms){
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${h(text)}</span>${action ? `<button type="button" id="toastAct">${h(action)}</button>` : ''}`;
  el.classList.add('show');
  if(action) document.getElementById('toastAct').onclick = () => { el.classList.remove('show'); fn && fn(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms || 5000);
}
function modal(html, wide){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay"><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = document.querySelector('#modalRoot [data-autofocus], #modalRoot input, #modalRoot .btn-primary'); if(first) first.focus();
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function confirmBox({ title, text, ok, cancel, danger }){
  return new Promise(res => {
    modal(`<h2>${title}</h2><p style="margin:0">${text}</p><div class="modal-actions"><button type="button" class="btn btn-ghost" id="cNo">${cancel || 'ยกเลิก'}</button><button type="button" class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" id="cYes" data-autofocus>${ok}</button></div>`);
    document.getElementById('cNo').onclick = () => { closeModal(); res(false); };
    document.getElementById('cYes').onclick = () => { closeModal(); res(true); };
  });
}
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(document.getElementById('modalRoot').innerHTML){ const no = document.getElementById('cNo') || document.querySelector('#modalRoot [data-close]'); no ? no.click() : closeModal(); }
  else if(document.getElementById('drawerRoot').innerHTML) closeDrawer();
  else if(document.getElementById('lightbox').classList.contains('show')) closeLightbox();
});
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}
function openLightbox(src){ const lb = document.getElementById('lightbox'); lb.querySelector('img').src = src; lb.classList.add('show'); }
function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); }

/* ---------- shell & routing ---------- */
function shell(content, nav){
  return `<header class="topbar"><div class="topbar-in"><a class="brand" href="#events"><span class="brand-mark" aria-hidden="true"></span>Event Expense Tracker <small>· Admin</small></a>
    <nav class="nav" aria-label="เมนู"><a href="#events" class="${nav === 'events' ? 'on' : ''}">กิจกรรมทั้งหมด</a><a href="#export" class="${nav === 'export' ? 'on' : ''}">Export Excel</a><a href="#" onclick="logout(); return false;">ออกจากหน้า Admin</a></nav></div></header>
    <main>${content}</main>`;
}
function setApp(html){ document.getElementById('app').innerHTML = html; }
function logout(){ try{ localStorage.removeItem('eetAdminKey'); }catch(e){} viewLogin(); }
function loadFailHtml(what){
  return `<section class="card" style="text-align:center;padding:48px 24px;align-items:center"><b style="font-size:18px">โหลด${what}ไม่สำเร็จ</b><span class="muted">อินเทอร์เน็ตหลุด หรือระบบไม่ตอบสนอง ข้อมูลในระบบไม่ได้หาย</span><button type="button" class="btn btn-primary" onclick="route()">ลองโหลดอีกครั้ง</button></section>`;
}
async function route(){
  closeDrawer(true);
  if(!adminKey()) return viewLogin();
  const r = (location.hash || '#events').slice(1);
  try{
    if(r === 'new') return await viewForm(null);
    if(r.startsWith('edit-')) return await viewForm(r.slice(5));
    if(r.startsWith('event-')) return await viewEvent(r.slice(6));
    if(r === 'export') return await viewExport();
    return await viewEvents();
  }catch(err){ if(String(err && err.message) !== 'UNAUTHORIZED') console.error(err); }
}
window.addEventListener('hashchange', route);

/* ---------- A1 passcode ---------- */
function viewLogin(msg){
  setApp(`<header class="topbar"><div class="topbar-in"><span class="brand"><span class="brand-mark" aria-hidden="true"></span>Event Expense Tracker <small>· Admin</small></span></div></header>
    <main><section class="card login"><h1 style="font-size:24px">เข้าสู่หน้า Admin</h1><p class="muted" style="margin:0">ใส่รหัส Admin ครั้งเดียว เบราว์เซอร์นี้จะจำไว้ให้</p>
      <div class="fld"><label for="pw">รหัส Admin <span class="req">*</span></label><input id="pw" type="password" class="${msg ? 'invalid' : ''}" onkeydown="if(event.key==='Enter') login()">${msg ? `<span class="fld-err" role="alert">${h(msg)}</span>` : ''}</div>
      <button type="button" class="btn btn-primary" id="loginBtn" onclick="login()">เข้าสู่ระบบ</button>
      <p class="hint" style="margin:0">ไม่รู้รหัส? ติดต่อผู้ดูแลระบบ · พนักงานไม่ต้องใช้รหัส ใช้ลิงก์ฟอร์มได้เลย</p></section></main>`);
  document.getElementById('pw').focus();
}
async function login(){
  const v = document.getElementById('pw').value.trim();
  if(!v) return viewLogin('กรุณาใส่รหัส');
  const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…';
  try{ localStorage.setItem('eetAdminKey', v); }catch(e){}
  try{
    const res = await callApi('verifyAdmin', {});
    if(res && res.ok) return route();
    viewLogin('ตรวจสอบรหัสไม่สำเร็จ ลองใหม่อีกครั้ง');
  }catch(err){
    if(String(err && err.message) === 'UNAUTHORIZED') viewLogin('รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง');
    else { try{ localStorage.removeItem('eetAdminKey'); }catch(e){} viewLogin('เชื่อมต่อระบบไม่ได้ ลองใหม่อีกครั้ง'); }
  }
}

/* ---------- A2 events list ---------- */
const eventsHead = () => `<div class="row between" style="align-items:flex-end"><div><h1>กิจกรรมทั้งหมด</h1></div>
  <div class="row"><a class="btn" href="#export">Export Excel หลายกิจกรรม</a><a class="btn btn-primary" href="#new">+ สร้างกิจกรรม</a></div></div>`;
async function loadEvents(force){
  if(UI.events && !force) return UI.events;
  const res = await callApi('listAllEvents', {});
  if(!res || !res.ok) throw new Error(res && res.error || 'load');
  UI.events = res.events.map(e => ({ id:e.eventId, name:e.eventName, owner:e.ownerName, venue:e.venue, start:e.startDate, end:e.endDate, closeAt:e.closeAt || '', isClosed:!!e.isClosed,
    n:e.staffCount || 0, sent:e.submittedCount || 0, total:e.totalAmount || 0, formLink:e.formLink }));
  return UI.events;
}
async function viewEvents(){
  setApp(shell(eventsHead() + `<div class="card">${[1,2,3].map(() => '<div class="row"><div class="grow" style="display:flex;flex-direction:column;gap:8px"><div class="skel" style="width:60%;height:16px"></div><div class="skel" style="width:40%"></div></div><div class="skel" style="width:90px;height:20px"></div></div>').join('<hr style="border:none;border-top:1px solid #EEEEEA;margin:6px 0">')}</div>`, 'events'));
  try{ await loadEvents(true); }
  catch(err){ if(String(err.message) === 'UNAUTHORIZED') throw err; setApp(shell(eventsHead() + loadFailHtml('รายการกิจกรรม'), 'events')); return; }
  if(!UI.events.length){
    setApp(shell(eventsHead() + `<section class="card dashed" style="text-align:center;padding:48px 24px;align-items:center"><b style="font-size:20px">ยังไม่มีกิจกรรม</b><span class="muted">สร้างกิจกรรมแรก ใส่รายชื่อพนักงาน แล้วระบบจะให้ลิงก์ฟอร์มไปส่งต่อ</span><a class="btn btn-primary" href="#new">+ สร้างกิจกรรมแรก</a></section>`, 'events'));
    return;
  }
  renderEventList();
}
function renderEventList(){
  const all = UI.events;
  const counts = { all: all.length, open: all.filter(e => e.sent < e.n).length, done: all.filter(e => e.n && e.sent === e.n).length };
  const q = UI.q.trim();
  const list = all.filter(ev => (!q || (ev.name + ev.venue + ev.owner).includes(q)) && (UI.filter === 'all' || (UI.filter === 'open' ? ev.sent < ev.n : ev.n && ev.sent === ev.n)));
  const chip = (k, l) => `<button type="button" class="chip${UI.filter === k ? ' on' : ''}" onclick="UI.filter='${k}'; renderEventList()">${l} ${counts[k]}</button>`;
  const cards = list.map(ev => {
    const deadline = ev.closeAt ? (ev.isClosed ? '<span class="chip">ปิดรับแล้ว</span>' : `<span class="chip">ปิดรับ ${h(thDT(ev.closeAt))}</span>`) : '';
    const state = ev.n && ev.sent === ev.n ? '<span class="chip ok">ครบแล้ว</span>' : `<span class="chip warn">ยังไม่ส่ง ${ev.n - ev.sent}</span>`;
    return `<article class="ev-card"><div class="ev-main"><a class="ev-name" href="#event-${h(ev.id)}">${h(ev.name)}</a>
      <span class="muted small">${h(thDate(ev.start))}${ev.end && ev.end !== ev.start ? '–' + h(thDate(ev.end)) : ''} · ${h(ev.venue || '-')} · ผู้สร้าง: ${h(ev.owner)}</span>
      <span class="row" style="gap:8px;margin-top:2px"><b class="small">ส่งแล้ว ${ev.sent}/${ev.n} คน</b>${state}${deadline}</span></div>
      <div class="ev-amt"><div class="muted small">ยอดรวม</div><b>฿ ${fmt(ev.total)}</b></div>
      <div class="row" style="gap:8px"><button type="button" class="btn" onclick="copyLink('${h(ev.id)}')">คัดลอกลิงก์ฟอร์ม</button><a class="btn" href="#event-${h(ev.id)}">เปิด</a></div></article>`;
  }).join('') || `<section class="card dashed" style="text-align:center"><span class="muted">ไม่พบกิจกรรมที่ตรงกับการค้นหา</span></section>`;
  setApp(shell(eventsHead() + `<div class="row" style="align-items:flex-end"><div class="fld" style="flex:1 1 320px"><label for="q">ค้นหากิจกรรม</label><input id="q" value="${h(UI.q)}" placeholder="พิมพ์ชื่อกิจกรรม สถานที่ หรือผู้สร้าง" oninput="UI.q=this.value; renderEventList(); const i=document.getElementById('q'); i.focus(); i.setSelectionRange(i.value.length,i.value.length);"></div>
    <div class="row" style="gap:8px">${chip('all','ทั้งหมด')}${chip('open','ยังส่งไม่ครบ')}${chip('done','ส่งครบแล้ว')}</div></div>` + cards, 'events'));
}
async function copyLink(id){
  const ev = (UI.events || []).find(e => e.id === id) || (UI.roster && UI.roster.event.eventId === id ? { formLink: UI.roster.formLink } : null);
  await copyText(ev && ev.formLink ? ev.formLink : location.origin + '/form.html?event=' + encodeURIComponent(id));
  toast('คัดลอกลิงก์ฟอร์มแล้ว ส่งให้พนักงานได้เลย');
}

/* ---------- A3 create / edit ---------- */
function daysBetween(a, b){
  if(!a) return [];
  const out = []; const d = new Date(a + 'T00:00:00'); const end = new Date((b || a) + 'T00:00:00');
  for(let i = 0; i < 31 && d <= end; i++){ out.push(isoD(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function draftKey(id){ return 'eetAdminDraft:' + (id || 'new'); }
async function viewForm(id){
  setApp(shell(`<div class="card">${[1,2,3].map(() => '<div class="skel" style="width:70%;height:18px"></div><div class="skel" style="height:44px"></div>').join('')}</div>`, 'events'));
  let f = { id:null, name:'', owner:'', venue:'', start:'', end:'', closeDate:'', closeTime:'18:00', staff:[], fuel:[], bulk:'', errors:{}, submitted:{} };
  if(id){
    let info, roster;
    try{ [info, roster] = await Promise.all([callApi('getEventInfo', { eventId:id }), callApi('getEventRoster', { eventId:id })]); }
    catch(err){ if(String(err.message) === 'UNAUTHORIZED') throw err; setApp(shell(loadFailHtml('ข้อมูลกิจกรรม'), 'events')); return; }
    if(!info || !info.ok){ setApp(shell(loadFailHtml('ข้อมูลกิจกรรม'), 'events')); return; }
    const ev = info.event;
    const evDays = daysBetween(ev.startDate, ev.endDate);
    f = { id, name:ev.eventName, owner:ev.ownerName, venue:ev.venue || '', start:ev.startDate, end:ev.endDate && ev.endDate !== ev.startDate ? ev.endDate : '',
          closeDate:(ev.closeAt || '').split('T')[0], closeTime:(ev.closeAt || '').split('T')[1] || '18:00',
          staff:(info.employees || []).map(e => ({ name:e.name, dept:e.department || '' })),
          fuel:(info.fuelPrices || []).map(fp => ({ date:fp.date, price: fp.price || '', receiptUrl: fp.receiptUrl || '', preview:null, upload:null, extra: !evDays.includes(fp.date) })),
          bulk:'', errors:{}, submitted:{} };
    ((roster && roster.roster) || []).forEach(r => { if(r.submitted) f.submitted[r.employeeName] = r.totalAmount; });
  }
  UI.form = f;
  syncFuelDays();
  let draft = null; try{ draft = JSON.parse(localStorage.getItem(draftKey(id)) || 'null'); }catch(e){}
  f.draftFound = draft;
  renderForm();
  if(id && f.fuel.some(x => x.receiptUrl)){
    try{
      const r = await callApi('getFuelReceiptImages', { eventId:id });
      if(r && r.ok && UI.form === f){
        (r.fuelPrices || []).forEach(fp => { const row = f.fuel.find(x => x.date === fp.date); if(row && fp.receiptImage && fp.receiptImage.base64) row.preview = fp.receiptImage.base64; });
        renderForm();
      }
    }catch(e){}
  }
}
function syncFuelDays(){
  const f = UI.form, days = daysBetween(f.start, f.end);
  const keep = f.fuel.filter(x => x.extra || days.includes(x.date));
  days.forEach(d => { if(!keep.find(x => x.date === d)) keep.push({ date:d, price:'', receiptUrl:'', preview:null, upload:null, extra:false }); });
  keep.forEach(x => { if(!x.extra && !days.includes(x.date)) x.extra = true; });
  f.fuel = keep.sort((a, b) => (a.date || '0').localeCompare(b.date || '0'));
}
function draftData(){ const f = UI.form; return { ...f, draftFound:null, errors:{}, savedAt: Date.now() }; }
function saveDraft(){
  const f = UI.form; if(!f) return;
  let ok = true;
  try{ localStorage.setItem(draftKey(f.id), JSON.stringify(draftData())); }
  catch(e){ // receipts too big for the draft: keep everything else
    try{ const d = draftData(); d.fuel = d.fuel.map(x => ({ ...x, upload:null, preview: x.upload ? null : x.preview })); localStorage.setItem(draftKey(f.id), JSON.stringify(d)); }catch(e2){ ok = false; }
  }
  const el = document.getElementById('draftStat');
  if(el && ok) el.innerHTML = `<b class="draft-ok">บันทึกร่างในเครื่องนี้แล้ว ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}</b> <span class="muted">· ยังไม่ได้บันทึกเข้าระบบ</span>`;
}
let draftT = null;
function touch(){ clearTimeout(draftT); draftT = setTimeout(saveDraft, 700); }
function setF(k, v){ UI.form[k] = v; if(UI.form.errors[k]) delete UI.form.errors[k]; if(k === 'start' || k === 'end'){ syncFuelDays(); renderForm(); } touch(); }

function renderForm(){
  const f = UI.form, E = f.errors || {};

     <div class="row" style="gap:8px"><button type="button" class="btn btn-primary" onclick="useDraft()">ใช้ร่างนี้ทำต่อ</button><button type="button" class="btn" onclick="discardDraft()">เริ่มใหม่ (ทิ้งร่าง)</button></div></div>` : '';

      <td>${f.submitted[s.name] != null ? '<span class="chip ok">ส่งแล้ว</span>' : (s.isNew ? `<span class="chip ${s.dept ? 'ok' : 'warn'}">เพิ่งเพิ่ม${s.dept ? '' : ' · ยังไม่มีแผนก'}</span>` : '')}</td>
      <td class="num"><button type="button" class="btn btn-danger btn-sm" onclick="removeStaff(${i})">ลบ</button></td></tr>`).join('');
  const fuelRows = f.fuel.map((x, i) => {

    return `<tr><td>${x.extra
        ? `<div class="row" style="gap:8px;flex-wrap:nowrap"><input type="date" id="fuelDate${i}" aria-label="วันที่ของวันสำรอง" value="${h(x.date)}" class="${!x.date && E.fuel ? 'invalid' : ''}" style="max-width:190px" onchange="setFuelDate(${i}, this.value)"><span class="chip warn">วันสำรอง</span></div>`
        : `${h(thDate(x.date))} <span class="chip">วันงาน</span>`}</td>
      <td><input aria-label="ราคาน้ำมัน ${h(x.date)}" type="number" step="0.01" min="0" value="${h(x.price)}" placeholder="0.00" style="max-width:140px" oninput="UI.form.fuel[${i}].price=this.value; touch()"></td>
      <td><div class="row" style="gap:8px">${img ? `<button type="button" class="thumb" style="padding:0;cursor:zoom-in" onclick="openLightbox(UI.form.fuel[${i}].upload ? UI.form.fuel[${i}].upload.base64 : UI.form.fuel[${i}].preview)"><img src="${img}" alt="ใบเสร็จ"></button>` : (has ? '<span class="thumb">กำลังโหลด…</span>' : '')}
        <label class="file-btn">${ICON.clip}${has ? 'เปลี่ยน' : 'อัปโหลดใบเสร็จ'}<input type="file" accept="image/*" onchange="fuelReceipt(${i}, this)"></label>
        ${has ? `<button type="button" class="btn btn-danger btn-sm" onclick="UI.form.fuel[${i}].upload=null; UI.form.fuel[${i}].receiptUrl=''; UI.form.fuel[${i}].preview=null; renderForm(); touch()">ลบใบเสร็จ</button>` : ''}
        ${x.extra ? `<button type="button" class="btn btn-danger btn-sm" onclick="UI.form.fuel.splice(${i},1); renderForm(); touch()">ลบวันนี้</button>` : ''}</div></td></tr>`;
  }).join('');
  setApp(shell(`<div class="crumb"><a href="#events">กิจกรรมทั้งหมด</a> / ${f.id ? 'แก้ไขกิจกรรม' : 'สร้างกิจกรรม'}</div>
    <div><h1>${f.id ? 'แก้ไขกิจกรรม' : 'สร้างกิจกรรม'}</h1><p class="sub">กรอก 3 ส่วน แล้วกดบันทึก ระบบจะสร้างลิงก์ฟอร์มให้ทันที</p></div>
    ${draftBanner}${errBanner}
    <section class="card"><h2>1 · ข้อมูลกิจกรรม</h2><div class="grid g2">

    </div></section>
    <section class="card"><h2>2 · รายชื่อพนักงานที่เบิกได้ <span class="muted" style="font-weight:400;font-size:15px">(${f.staff.length} คน)</span></h2>
      <div class="fld" style="background:#FAFAF8;border:1px solid var(--line);border-radius:12px;padding:16px">
        <label for="bulk">เพิ่มรายชื่อ <span class="muted" style="font-weight:400">— 1 คนต่อ 1 บรรทัด (กด Enter ขึ้นคนใหม่)</span></label>
        <textarea id="bulk" placeholder="สมชาย ใจดี, ฝ่ายการตลาด&#10;วิภาวดี ศรีสุข, ฝ่ายบัญชี" oninput="UI.form.bulk=this.value; const n=this.value.split('\\n').filter(l=>l.trim()).length; const b=document.getElementById('bulkBtn'); b.textContent='ตรวจสอบและเพิ่ม '+n+' แถว'; b.disabled=!n; this.classList.remove('invalid'); touch()">${h(f.bulk)}</textarea>
        <div class="row between"><span class="hint">ใส่แผนกต่อท้ายด้วย , ได้ · วางจาก Excel (ชื่อ | แผนก) ลงช่องนี้ได้เลย · มีหัวตารางติดมาก็ได้</span>
        <button type="button" class="btn btn-primary" id="bulkBtn" onclick="previewBulk()" ${lines ? '' : 'disabled'}>ตรวจสอบและเพิ่ม ${lines} แถว</button></div>
      </div>
      ${f.staff.length ? `<div class="table-wrap"><table><thead><tr><th>ชื่อ-นามสกุล</th><th>แผนก/ฝ่าย</th><th>สถานะ</th><th></th></tr></thead><tbody>${staffRows}</tbody></table></div>` : '<p class="muted" style="margin:0">ยังไม่มีรายชื่อ — พิมพ์หรือวางรายชื่อในช่องด้านบน</p>'}
    </section>
    <section class="card"><div class="row between"><h2>3 · ราคาน้ำมันแก๊สโซฮอล์ 91 รายวัน</h2><button type="button" class="btn" onclick="addFuelDay()">+ เพิ่มวันสำรอง</button></div>
      <p class="hint" style="margin:0">ใช้คำนวณค่ารถยนต์ส่วนตัว: (ระยะทาง ÷ 15) × ราคาของวันนั้น · วันงานสร้างให้อัตโนมัติจากวันที่ด้านบน</p>
      ${f.fuel.length ? `<div class="table-wrap"><table><thead><tr><th>วันที่</th><th>ราคา (บาท/ลิตร)</th><th>ใบเสร็จ</th></tr></thead><tbody>${fuelRows}</tbody></table></div>` : '<p class="muted" style="margin:0">เลือกวันที่เริ่มกิจกรรมก่อน แล้วรายการวันจะขึ้นมา</p>'}
    </section>
    <div class="savebar"><span id="draftStat" class="muted">ยังไม่มีการแก้ไข</span><div class="row" style="gap:8px"><a class="btn btn-ghost" href="${f.id ? '#event-' + h(f.id) : '#events'}">ยกเลิก</a><button type="button" class="btn btn-primary" id="saveBtn" onclick="saveEvent()">บันทึกกิจกรรม</button></div></div>`, 'events'));
}
function useDraft(){ const d = UI.form.draftFound; UI.form = { ...d, submitted: UI.form.submitted, draftFound:null, errors:{} }; renderForm(); saveDraft(); }
async function discardDraft(){
  const ok = await confirmBox({ title:'เริ่มใหม่และทิ้งร่างนี้?', text:'ข้อมูลในร่าง (ชื่อกิจกรรม, รายชื่อ, ราคาน้ำมัน) จะหายและกู้คืนไม่ได้', ok:'ทิ้งร่าง', cancel:'กลับไปใช้ร่าง', danger:true });
  if(!ok) return;
  try{ localStorage.removeItem(draftKey(UI.form.id)); }catch(e){}
  UI.form.draftFound = null; renderForm();
}
function addFuelDay(){
  UI.form.fuel.unshift({ date:'', price:'', receiptUrl:'', preview:null, upload:null, extra:true });
  renderForm(); touch();
  const el = document.getElementById('fuelDate0');
  if(el){ el.focus(); try{ el.showPicker && el.showPicker(); }catch(e){} }

function shrinkImage(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const MAX = 1600; let w = img.naturalWidth, hh = img.naturalHeight;
      if(w > MAX || hh > MAX){ const k = MAX / Math.max(w, hh); w = Math.round(w * k); hh = Math.round(hh * k); }
      const c = document.createElement('canvas'); c.width = w; c.height = hh; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, hh); x.drawImage(img, 0, 0, w, hh);
      res(c.toDataURL('image/jpeg', 0.85)); }; img.onerror = () => rej(new Error('ไฟล์นี้เปิดเป็นรูปไม่ได้ (เช่น HEIC) — บันทึกเป็น JPG/PNG แล้วแนบใหม่')); img.src = r.result; };
    r.onerror = () => rej(new Error('อ่านไฟล์ไม่สำเร็จ')); r.readAsDataURL(file);
  });
}

/* bulk names → preview */
function parseBulk(text){
  const existing = new Set(UI.form.staff.map(s => s.name));
  const seen = new Set();
  return text.split('\n').map(l => l.replace(/\r/g, '')).filter(l => l.trim()).map((line, idx) => {
    let parts;
    if(line.includes('\t')) parts = line.split('\t');
    else if(line.includes(',')) parts = line.split(',');
    else { const m = line.match(/^(.*\S)\s+-\s+(.+)$/); parts = m ? [m[1], m[2]] : [line]; } // old format: "ชื่อ - แผนก"
    const name = (parts[0] || '').trim().replace(/\s+/g, ' '), dept = (parts.slice(1).join(' ') || '').trim();
    let status = 'new', checked = true;
    if(idx === 0 && /ชื่อ|name/i.test(name) && (/แผนก|dep/i.test(dept) || !dept)) { status = 'header'; checked = false; }
    else if(!name || /^[\d.,\s฿-]+$/.test(name)) { status = 'bad'; checked = false; }
    else if(existing.has(name)) { status = 'exists'; checked = false; }
    else if(seen.has(name)) { status = 'dup'; checked = false; }
    else if(!dept) status = 'nodept';
    if(status === 'new' || status === 'nodept') seen.add(name);
    return { name, dept, status, checked };
  });
}

async function runPool(items, limit, fn){

  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => { while(next < items.length){ const k = next++; out[k] = await fn(items[k], k); } }));
  return out;
}

    saveAs(await zip.generateAsync({ type:'blob' }), `เอกสารเบิกค่าเดินทาง_${N.evName}.zip`);
    if(missing.length) toast(`ดาวน์โหลด ZIP ได้ ${rows.length - missing.length} จาก ${rows.length} ไฟล์ — ไม่พบไฟล์ของ: ${missing.join(', ')} (ให้คนนั้นส่งใหม่จากลิงก์เดิม)`, null, null, 12000);
    else toast(`ดาวน์โหลด ZIP แล้ว (${rows.length} ไฟล์)`);
  }finally{ btn.disabled = false; btn.textContent = orig; }
}

/* ---------- Word (.docx) built from the stored trip data ---------- */
async function eventFuelPrices(){
  if(UI.roster.fuel) return UI.roster.fuel;
  try{ const r = await callApi('getEventInfo', { eventId: UI.roster.id }); UI.roster.fuel = (r && r.ok && r.fuelPrices) || []; }catch(e){ UI.roster.fuel = []; }
  return UI.roster.fuel;
}
function fuelPriceFor(dateStr, fp){
  if(!dateStr || !fp || !fp.length) return 0;
  const exact = fp.find(x => x.date === dateStr); if(exact) return Number(exact.price) || 0;
  const prior = fp.filter(x => x.date < dateStr).sort((a, b) => b.date.localeCompare(a.date)); if(prior.length) return Number(prior[0].price) || 0;
  return Number(fp.slice().sort((a, b) => a.date.localeCompare(b.date))[0].price) || 0;
}
function segDetail(seg, dateStr, fp){
  if(seg.type === 'PARKING' || seg.type === 'NO_CLAIM' || (seg.type === 'TOLL' && !seg.origin && !seg.destination)) return '-';
  if(seg.type === 'CAR') return `จาก ${seg.origin || '-'} - ไป ${seg.destination || '-'} ${(Number(seg.distanceKm) || 0).toFixed(2)}/15x${fuelPriceFor(dateStr, fp).toFixed(2)} = ${(Number(seg.amount) || 0).toFixed(2)} บาท`;
  return `${seg.origin || '-'} → ${seg.destination || '-'}`;
}
function tripsToDays(trips){
  const days = [];
  (trips || []).forEach(t => { if(!t) return; let d = days.find(x => x.date === t.date); if(!d){ d = { date:t.date, out:[], ret:[] }; days.push(d); } (t.label === 'ขากลับ' ? d.ret : d.out).push(...(t.segments || [])); });
  return days;
}
async function buildDocx(row, fp, images){
  const D = window.docx; if(!D) throw new Error('โหลดไลบรารีสร้างไฟล์ Word ไม่สำเร็จ');
  const FONT = 'TH Sarabun New', SZ = { body:24, title:32, heading:28, sub:24, total:28 };
  const run = (t, o = {}) => new D.TextRun({ text:String(t == null ? '' : t), font:FONT, size:o.size || SZ.body, bold:!!o.bold, color:o.color });
  const para = (t, o = {}) => new D.Paragraph({ alignment:o.align, spacing:{ after: o.after == null ? 80 : o.after }, children:[run(t, o)] });
  const COLS = [600, 2300, 5106, 1900], dxa = p => Math.round(9906 * p / 100);
  const cell = (t, w, o = {}) => new D.TableCell({ width:{ size:dxa(w), type:D.WidthType.DXA }, columnSpan:o.span, shading:o.shade ? { fill:o.shade, type:D.ShadingType.CLEAR, color:'auto' } : undefined,
    children:[para(t, { size:SZ.body, bold:o.bold, after:0, align:o.right ? D.AlignmentType.RIGHT : undefined })] });
  const days = tripsToDays(row.tripDetails);
  const kids = [para('เอกสารค่าเดินทาง', { bold:true, size:SZ.title }), para(UI.roster.event.eventName || ''),
    para('ผู้เบิก: ' + row.employeeName + '     แผนก/ฝ่าย: ' + (row.department || '-'), { after:200 })];
  days.forEach((d, di) => {
    kids.push(para(days.length > 1 ? `วันที่ ${di + 1} — ${thDate(d.date)}` : (thDate(d.date) || 'รายละเอียดการเดินทาง'), { bold:true, size:SZ.heading, after:120 }));
    [['ขาไป', d.out], ['ขากลับ', d.ret]].forEach(([label, segs]) => {
      let sub = 0; const head = ['#', 'ประเภท', 'รายละเอียด', 'จำนวนเงิน'];
      const rows = [new D.TableRow({ tableHeader:true, children: head.map((t, k) => cell(t, [6, 23, 52, 20][k] - (k === 3 ? 1 : 0), { bold:true, shade:'EEF2EC', right:k === 3 })) })];
      segs.forEach((sg, k) => { sub += Number(sg.amount) || 0; rows.push(new D.TableRow({ children:[cell(String(k + 1), 6), cell(typeLabel(sg), 23), cell(segDetail(sg, d.date, fp), 52), cell((Number(sg.amount) || 0).toFixed(2), 19, { right:true })] })); });
      rows.push(new D.TableRow({ children:[cell('ยอดรวม ' + label, 81, { bold:true, span:3, shade:'FAFAFA' }), cell(sub.toFixed(2), 19, { bold:true, right:true, shade:'FAFAFA' })] }));
      kids.push(para(label, { bold:true, size:SZ.sub, after:40 }));
      kids.push(new D.Table({ width:{ size:9906, type:D.WidthType.DXA }, columnWidths:COLS, layout:D.TableLayoutType.FIXED, rows }));
      kids.push(para('', { after:120 }));
    });
  });
  kids.push(para('ยอดรวมทั้งสิ้น ' + fmt(row.totalAmount) + ' บาท', { bold:true, size:SZ.total, after:240 }));
  const ev = [];
  days.forEach(d => [['ขาไป', d.out], ['ขากลับ', d.ret]].forEach(([dir, segs]) => segs.forEach(sg => (sg.attachmentUrls || []).forEach(u => ev.push({ u, cap:`หลักฐาน: ${dir} — ${typeLabel(sg)} (${thDate(d.date)})` })))));
  if(ev.length){
    kids.push(new D.Paragraph({ pageBreakBefore:true, spacing:{ after:160 }, children:[run('หลักฐานประกอบการเบิกจ่าย', { bold:true, size:SZ.heading })] }));
    for(const e of ev){
      kids.push(para(e.cap, { after:60 }));
      const att = images[e.u];
      if(!att || !/^data:image\//.test(att.base64 || '')){ kids.push(para(att ? '(ไฟล์ PDF — เปิดดูได้ที่ลิงก์ใน Drive)' : '(โหลดไฟล์นี้ไม่สำเร็จ)', { color:'7A7A7A' })); continue; }
      const img = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = att.base64; });
      if(!img){ kids.push(para('(แสดงรูปนี้ไม่ได้)', { color:'7A7A7A' })); continue; }
      let w = 340, hh = Math.round(img.naturalHeight * 340 / img.naturalWidth); if(hh > 800){ hh = 800; w = Math.round(img.naturalWidth * 800 / img.naturalHeight); }
      const bytes = Uint8Array.from(atob(att.base64.split(',')[1]), c => c.charCodeAt(0));
      kids.push(new D.Paragraph({ alignment:D.AlignmentType.CENTER, spacing:{ after:200 }, children:[new D.ImageRun({ data:bytes, transformation:{ width:w, height:hh } })] }));
    }
  }
  const doc = new D.Document({ styles:{ default:{ document:{ run:{ font:FONT, size:SZ.body } } } },
    sections:[{ properties:{ page:{ size:{ width:11906, height:16838 }, margin:{ top:1000, bottom:1000, left:1000, right:1000 } } }, children:kids }] });
  return D.Packer.toBlob(doc);
}
async function docxForRow(row){
  const fp = await eventFuelPrices();
  let images = {};
  try{ const r = await callApi('getSubmissionAttachmentImages', { eventId: UI.roster.id, employeeName: row.employeeName }); if(r && r.ok) images = r.images || {}; }catch(e){ if(String(e.message) === 'UNAUTHORIZED') throw e; }
  return buildDocx(row, fp, images);
}
async function downloadOneDocx(i){
  const row = UI.roster.rows[i]; toast('กำลังสร้างไฟล์ Word ของ ' + row.employeeName + '…', null, null, 20000);
  try{ const blob = await docxForRow(row); saveAs(blob, zipNames().name(row, '.docx')); toast('ดาวน์โหลดไฟล์ Word แล้ว'); }
  catch(err){ if(String(err.message) !== 'UNAUTHORIZED') toast('สร้างไฟล์ Word ไม่สำเร็จ: ' + err.message, null, null, 8000); }
}
async function zipDocx(btn){
  const rows = selectedRows(); const orig = btn.textContent; btn.disabled = true; let done = 0;
  const zip = new JSZip(), N = zipNames(), failed = [];
  try{
    await runPool(rows, 2, async r => {
      try{ zip.file(N.name(r, '.docx'), await docxForRow(r)); }catch(e){ if(String(e.message) === 'UNAUTHORIZED') throw e; failed.push(r.employeeName); }
      btn.textContent = `กำลังสร้าง ZIP (${++done}/${rows.length})…`;
    });
    if(failed.length === rows.length){ toast('สร้างไฟล์ Word ไม่สำเร็จ', null, null, 8000); return; }
    saveAs(await zip.generateAsync({ type:'blob' }), `เอกสารเบิกค่าเดินทาง_${N.evName} (Word).zip`);
    toast(failed.length ? `ได้ ${rows.length - failed.length} จาก ${rows.length} ไฟล์ — สร้างไม่สำเร็จ: ${failed.join(', ')}` : `ดาวน์โหลด ZIP แล้ว (${rows.length} ไฟล์)`, null, null, failed.length ? 12000 : 5000);
  }finally{ btn.disabled = false; btn.textContent = orig; }
}

/* ---------- copy summary for Excel (same text format as before) ---------- */
function thDateDMY(s){ if(!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric' }); }
function segExcel(seg, dateStr, fp){
  const o = seg.origin || '-', d = seg.destination || '-', amt = (Number(seg.amount) || 0).toFixed(2);
  if(seg.type === 'CAR') return `เดินทางด้วยรถยนต์ส่วนตัว จาก ${o} - ไป ${d} ${(Number(seg.distanceKm) || 0).toFixed(2)}/15x${fuelPriceFor(dateStr, fp).toFixed(2)} = ${amt} บาท`;
  return `เดินทางด้วย${TYPE_LABELS[seg.type] || seg.type || '-'} จาก ${o} - ไป ${d} รวม ${amt} บาท`;
}
function excelLine(row, fp){
  const blocks = tripsToDays(row.tripDetails).map(b => {
    const parts = [thDateDMY(b.date)];
    const leg = (label, segs) => { const v = segs.filter(s => s && s.type); return v.length ? `${label} ${v.map(s => segExcel(s, b.date, fp)).join(' + ')}` : ''; };
    const o = leg('ขาไป', b.out), r = leg('ขากลับ', b.ret); if(o) parts.push(o); if(r) parts.push(r);
    return parts.join(' ');
  });
  return `${row.employeeName || '-'} - ${blocks.join(' | ')}`.replace(/[\r\n\t]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
}
async function copyExcelSummary(btn){
  const rows = selectedRows();
  const needFuel = rows.some(r => (r.tripDetails || []).some(t => (t.segments || []).some(s => s && s.type === 'CAR')));
  const fp = needFuel ? await eventFuelPrices() : [];
  await copyText(rows.map(r => excelLine(r, fp)).join('\n'));
  toast(`คัดลอกสรุป ${rows.length} คนแล้ว วางในเซลล์ Excel ได้เลย (1 คน = 1 บรรทัด)`);
}
function excelRows(eventName, roster){
  const out = []; let total = 0;
  roster.forEach((r, idx) => { const amt = r.submitted ? Number((Number(r.totalAmount) || 0).toFixed(2)) : 0; total += amt;
    out.push({ 'ชื่องาน':eventName, 'ลำดับสตาฟ':idx + 1, 'ชื่อสตาฟ':r.employeeName, 'แผนก':r.department || '', 'ยอดเงิน':amt.toFixed(2), 'link pdf':r.pdfUrl || '' }); });
  out.push({ 'ชื่องาน':eventName, 'ลำดับสตาฟ':'', 'ชื่อสตาฟ':'ยอดรวมทั้งสิ้น (Grand Total)', 'แผนก':'', 'ยอดเงิน':total.toFixed(2), 'link pdf':'' });
  return out;
}
function writeExcel(rows, name){
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'รายงานเบิกค่าเดินทาง'); XLSX.writeFile(wb, name);
}
function exportSelectedExcel(){
  writeExcel(excelRows(UI.roster.event.eventName, selectedRows()), `รายงานเบิกค่าเดินทาง_${safeName(UI.roster.event.eventName)}.xlsx`);

}

    ${days.map(day).join('') || '<p class="muted">ไม่มีรายการเดินทาง</p>'}
    <div style="border-top:1px solid var(--line);padding-top:12px"><b style="font-size:16px">ประวัติการส่ง</b>${hist}</div>
    <p class="hint" style="margin:0">“ใช้เวอร์ชันนี้” = กู้คืนเวอร์ชันเก่ากลับมาเป็นปัจจุบัน (ฉบับปัจจุบันถูกเก็บเป็นประวัติก่อนเสมอ)</p></aside></div>`;
}
async function restoreVersion(k){
  const dr = UI.drawer, row = UI.roster.rows[dr.i], vs = dr.versions, v = vs[k];
  const ok = await confirmBox({ title:`ใช้ “ครั้งที่ ${vs.length - k}” แทนฉบับปัจจุบัน?`, text:`ยอดจะเปลี่ยนจาก ฿ ${fmt(vs[0].totalAmount)} เป็น ฿ ${fmt(v.totalAmount)} · ฉบับปัจจุบันถูกเก็บไว้ในประวัติก่อน กลับมาใช้ได้อีก`, ok:'ใช้เวอร์ชันนี้' });
  if(!ok) return;
  try{
    const res = await callApi('restoreVersion', { eventId:UI.roster.id, employeeName:row.employeeName, key:v.key });
    if(!res || !res.ok){ toast('กู้คืนไม่สำเร็จ: ' + (res && res.error || ''), null, null, 8000); return; }
    const name = row.employeeName; UI.events = null;
    const r = await callApi('getEventRoster', { eventId:UI.roster.id });
    if(r && r.ok){ UI.roster.rows = r.roster; UI.roster.event = r.event; }
    const ni = UI.roster.rows.findIndex(x => x.employeeName === name);
    renderEvent(); if(ni > -1) openDrawer(ni);
    toast('กู้คืนแล้ว · ยอดปัจจุบัน ฿ ' + fmt(res.totalAmount));
  }catch(err){ if(String(err.message) !== 'UNAUTHORIZED') toast('กู้คืนไม่สำเร็จ: ' + err.message, null, null, 8000); }
}

/* ---------- A6 export ---------- */
async function viewExport(){
  if(!UI.events){
    setApp(shell(`<div class="card"><div class="skel" style="width:50%;height:18px"></div><div class="skel"></div><div class="skel"></div></div>`, 'export'));
    try{ await loadEvents(true); }catch(err){ if(String(err.message) === 'UNAUTHORIZED') throw err; setApp(shell(loadFailHtml('รายการกิจกรรม'), 'export')); return; }
  }
  renderExport();
}
function renderExport(){
  const X = UI.ex, q = X.q.trim();
  const list = UI.events.filter(ev => (!q || (ev.name + ev.venue).includes(q)) && (!X.from || (ev.end || ev.start) >= X.from) && (!X.to || ev.start <= X.to));
  const chosen = UI.events.filter(ev => UI.exportSel.has(ev.id));
  const people = chosen.reduce((n, ev) => n + ev.sent, 0), total = chosen.reduce((t, ev) => t + ev.total, 0);
  const allOn = list.length && list.every(ev => UI.exportSel.has(ev.id));
  UI.exportList = list.map(ev => ev.id);
  setApp(shell(`<div class="crumb"><a href="#events">กิจกรรมทั้งหมด</a> / Export Excel</div>
    <div><h1>Export Excel หลายกิจกรรม</h1><p class="sub">เลือกกิจกรรมที่ต้องการ แล้วดาวน์โหลดเป็นไฟล์เดียว (1 ชีต)</p></div>
    <section class="card" style="padding:20px"><div class="row between"><h2>ตัวกรอง</h2><button type="button" class="btn btn-reset" ${X.q || X.from || X.to ? '' : 'disabled'} onclick="UI.ex={q:'',from:'',to:''}; renderExport()">${ICON.reset} ล้างตัวกรอง</button></div>
      <div class="grid g3"><div class="fld"><label for="xq">ค้นหา</label><input id="xq" value="${h(X.q)}" placeholder="ชื่อกิจกรรม / สถานที่" onchange="UI.ex.q=this.value; renderExport()"></div>
      <div class="fld"><label for="xf">ตั้งแต่วันที่</label><input id="xf" type="date" value="${h(X.from)}" onchange="UI.ex.from=this.value; renderExport()"></div>
      <div class="fld"><label for="xt2">ถึงวันที่</label><input id="xt2" type="date" value="${h(X.to)}" onchange="UI.ex.to=this.value; renderExport()"></div></div></section>
    <div class="row between"><label class="row" style="gap:8px;font-weight:600"><input type="checkbox" ${allOn ? 'checked' : ''} ${list.length ? '' : 'disabled'} onchange="UI.exportList.forEach(id => this.checked ? UI.exportSel.add(id) : UI.exportSel.delete(id)); renderExport()">เลือกทั้งหมดที่แสดงอยู่ (${list.length})</label><span class="muted">แสดง ${list.length} จาก ${UI.events.length} กิจกรรมตามตัวกรอง</span></div>
    <div class="table-wrap"><table style="min-width:860px"><thead><tr><th></th><th>กิจกรรม</th><th>วันที่</th><th>สถานที่</th><th>ส่งแล้ว</th><th class="num">ยอดรวม</th></tr></thead><tbody>
      ${list.map(ev => `<tr><td><input type="checkbox" aria-label="เลือก ${h(ev.name)}" ${UI.exportSel.has(ev.id) ? 'checked' : ''} onchange="this.checked ? UI.exportSel.add('${h(ev.id)}') : UI.exportSel.delete('${h(ev.id)}'); renderExport()"></td><td><b>${h(ev.name)}</b></td><td>${h(thDate(ev.start))}</td><td>${h(ev.venue)}</td><td>${ev.sent}/${ev.n}</td><td class="num">฿ ${fmt(ev.total)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">ไม่มีกิจกรรมในช่วงนี้</td></tr>'}
    </tbody></table></div>
    <section class="card" style="padding:20px"><h2>คอลัมน์ในไฟล์ Excel</h2><p class="hint" style="margin:0">ชื่องาน · ลำดับสตาฟ · ชื่อสตาฟ · แผนก · ยอดเงิน · link pdf — ต่อท้ายแต่ละกิจกรรมด้วยแถว “ยอดรวมทั้งสิ้น (Grand Total)” เหมือนไฟล์เดิม</p></section>
    <div class="savebar"><span><b>เลือก ${chosen.length} กิจกรรม</b> · พนักงานที่ส่งแล้ว ${people} คน · ยอดรวม ฿ ${fmt(total)}</span><button type="button" class="btn btn-primary" id="exBtn" ${chosen.length ? '' : 'disabled'} onclick="downloadExportExcel()">ดาวน์โหลด Excel</button></div>`, 'export'));
}
async function downloadExportExcel(){
  const ids = UI.events.filter(ev => UI.exportSel.has(ev.id)).map(ev => ev.id);
  const btn = document.getElementById('exBtn'); btn.disabled = true; btn.textContent = 'กำลังดาวน์โหลด…';
  try{
    const res = await callApi('getRosters', { eventIds: ids });
    if(!res || !res.ok) throw new Error(res && res.error || 'load');
    const rows = [];
    ids.forEach(id => { const r = res.rosters[id]; if(r && r.ok) rows.push(...excelRows(r.event.eventName, r.roster || [])); });
    writeExcel(rows, 'รายงานเบิกค่าเดินทาง.xlsx');
    toast(`ดาวน์โหลด Excel แล้ว (${ids.length} กิจกรรม)`);
  }catch(err){ if(String(err.message) !== 'UNAUTHORIZED') toast('ดาวน์โหลดไม่สำเร็จ: ' + err.message, null, null, 8000); }
  finally{ btn.disabled = false; btn.textContent = 'ดาวน์โหลด Excel'; }
}

route();
