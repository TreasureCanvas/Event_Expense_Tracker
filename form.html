<!DOCTYPE html>
<html lang="th">
<head>
<!--
  ==========================================================================
  ⚠️ ไฟล์นี้ต้องถูกวางไว้ 2 ที่ ให้เนื้อหาตรงกันเป๊ะเสมอ:
  1. Apps Script Editor > ไฟล์ HTML ชื่อ "index" (ไม่ต้องมี .html ต่อท้ายตอนตั้งชื่อ)
     - นี่คือไฟล์ที่ระบบใช้จริงตอนพนักงานกดลิงก์ .../exec?page=form&event=EV-xxxx
     - ถ้าลืมอัปเดตไฟล์นี้ ลิงก์ที่แชร์ออกไปจะยังเป็น "ดีไซน์เก่า" อยู่ตลอด
       แม้จะแก้ไฟล์ที่วางใน Google Sites ไปแล้วก็ตาม เพราะเป็นคนละไฟล์กัน!
  2. (ถ้าต้องการ) วางในกล่อง "Embed code" ของ Google Sites เพื่อทำหน้า
     Landing Page อธิบายระบบ - ไม่บังคับ ไม่ใช่ลิงก์หลักที่ส่งให้พนักงานกรอกฟอร์ม

  🎨 แก้สี/ธีมของหน้านี้: ดูตัวแปร CSS ในบล็อก :root{...} ด้านล่างนี้เลย
  (บรรทัดถัดจากนี้ไม่กี่บรรทัด) เปลี่ยนค่าสีตรงนั้นที่เดียว มีผลกับทั้งหน้า
  ==========================================================================
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ใบเบิกค่าเดินทาง</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>
  // Uploaded PDF evidence files are rendered page-by-page into images (via
  // pdf.js) so each page can be captioned and scaled exactly like a photo
  // in the evidence section — this requires pointing pdf.js at its worker
  // script, which does the actual page-decoding off the main thread.
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>

<style>
  /* ===== 🎨 ธีมสีหลักของทั้งหน้า - แก้ตรงนี้ที่เดียว ===== */
  :root{
    --brand:#FE6D43; --brand-dark:#222222; --accent:#e8a33d;
    --bg:#F6F7FB; --card:#ffffff; --line:#e2e5e1; --text:#20281f;
    --muted:#686868; --danger:#c0392b; --ok:#1f7a4d; --warn:#b9770e;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Sarabun',sans-serif; font-size:15px; line-height:1.55;
    padding:18px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:20px; color:var(--brand-dark); margin:0 0 4px;}
  .sub{color:var(--muted); margin:0 0 20px; font-size:13.5px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px 20px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card h2{font-size:15.5px; margin:0 0 14px; color:var(--brand-dark); display:flex; align-items:center; gap:8px;}
  .card h2 .badge{background:var(--brand); color:#fff; border-radius:20px; font-size:12px; padding:2px 9px; font-weight:600;}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  input, select{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:9px;
    font-family:inherit; font-size:14.5px; background:#fff; color:var(--text);
  }
  input:focus, select:focus{outline:none; border-color:var(--brand);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field{margin-bottom:12px;}
  .trip-section-title{
    display:flex; align-items:center; gap:8px; margin:22px 0 12px; font-size:15.5px; font-weight:700; color:var(--brand-dark);
  }
  .trip-section-title:first-child{margin-top:0;}
  .trip-section-title .arrow{font-size:18px;}
  .day-block{border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px; background:#fbfbfd;}
  .day-header{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .segment{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px;
  }
  .segment-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .type-dropdown{position:relative; min-width:170px;}
  .type-dropdown summary{
    list-style:none; cursor:pointer; padding:9px 30px 9px 11px; border:1px solid var(--line); border-radius:9px;
    background:#fff; font-size:14px; display:block; position:relative; user-select:none;
  }
  .type-dropdown summary::-webkit-details-marker{display:none;}
  .type-dropdown summary::after{content:'▾'; position:absolute; right:11px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--muted);}
  .type-dropdown[open] summary::after{content:'▴';}
  .type-dropdown[open] summary{border-color:var(--brand);}
  .type-options{
    position:absolute; z-index:50; top:calc(100% + 4px); left:0; min-width:220px; max-height:260px; overflow-y:auto;
    background:#fff; border:1px solid var(--line); border-radius:9px; box-shadow:0 4px 14px rgba(0,0,0,.14); padding:4px;
  }
  .type-options .type-opt{padding:8px 10px; border-radius:6px; cursor:pointer; font-size:14px;}
  .type-options .type-opt:hover{background:#f1f4f0;}
  .type-options .type-opt.active{background:var(--brand); color:#fff;}
  .amount-line{
    display:flex; justify-content:space-between; align-items:center; margin-top:8px;
    font-size:13.5px; color:var(--muted);
  }
  .amount-line b{color:var(--brand-dark); font-size:15px;}
  .trip-total-line{
    display:flex; justify-content:space-between; font-size:14px; color:var(--brand-dark);
    font-weight:700; padding:8px 2px 4px; border-top:1px dashed var(--line); margin-top:4px;
  }
  .attach-box{margin-top:9px;}
  .attach-box .preview-list{margin-top:8px; display:flex; flex-wrap:wrap; gap:8px;}
  .attach-thumb{position:relative; display:inline-flex; align-items:center; gap:6px; background:#f1f4f0; border-radius:8px; padding:4px 8px 4px 4px;}
  .attach-thumb img{height:38px; width:38px; object-fit:cover; border-radius:6px;}
  .attach-thumb a{font-size:12px; color:var(--brand-dark);}
  .attach-thumb .rm{cursor:pointer; color:var(--danger); font-weight:700; font-size:13px; padding:0 3px;}
  .attach-thumb-loading{padding:4px 10px;}
  .pdf-thumb-icon{font-size:18px; line-height:1;}
  .pdf-thumb-name{font-size:11.5px; color:var(--text); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .thumb-loading-text{font-size:11.5px; color:var(--muted); font-style:italic;}
  .existing-badge{font-size:10px; color:#6b7a63; background:#e2ebdd; border-radius:5px; padding:1px 5px; white-space:nowrap;}
  .loading-status{display:none; align-items:center; gap:7px; margin-top:7px; font-size:12.5px; color:var(--brand-dark);}
  .loading-status.show{display:flex;}
  .spinner{width:14px; height:14px; border-radius:50%; border:2px solid #d8e2d3; border-top-color:var(--brand-dark); animation:spin .7s linear infinite; flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .attach-warn{color:var(--danger); font-size:12.5px; margin-top:5px; display:none;}
  .btn{
    border:none; border-radius:9px; padding:9px 15px; font-family:inherit; font-weight:600;
    font-size:13.5px; cursor:pointer; transition:.15s;
  }
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-outline{background:#fff; border:1px solid var(--line); color:var(--text);}
  .btn-outline:hover{border-color:var(--brand);}
  .btn-ghost{background:transparent; color:var(--danger); padding:6px 10px; font-size:12.5px;}
  .btn-add-segment{width:100%; border:1.5px dashed #c9d2c6; background:#fff; color:var(--brand-dark);}
  .footer-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .total-box{
    background:var(--brand); color:#fff; border-radius:var(--radius); padding:16px 18px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;
  }
  .total-box .num{font-size:24px; font-weight:700;}
  textarea.summary-preview{
    width:100%; min-height:170px; font-family:monospace; font-size:12.5px; padding:10px;
    border:1px solid var(--line); border-radius:9px; background:#fafbf9; white-space:pre;
  }
  .msg{padding:11px 13px; border-radius:9px; font-size:13.5px; margin-bottom:14px; display:none;}
  .msg.err{background:#fdeceb; color:var(--danger); border:1px solid #f3c6c1;}
  .msg.ok{background:#eaf6ef; color:var(--ok); border:1px solid #bfe5cd;}
  .msg.warn{background:#fdf3e2; color:var(--warn); border:1px solid #f3ddb0;}
  /* Inline toast shown near the submit/download area (e.g. large-PDF-size
     notice) — appears in place without scrolling/jumping the page, and
     auto-dismisses on its own. */
  .inline-toast{padding:9px 12px; border-radius:8px; font-size:12.5px; margin-top:10px;
    background:#fdf3e2; color:var(--warn); border:1px solid #f3ddb0;
    display:none; opacity:0; transition:opacity .25s ease;}
  .inline-toast.show{display:block;}
  .inline-toast.visible{opacity:1;}
  .hint{font-size:12px; color:var(--muted); margin-top:3px;}
  .fuel-warn{font-size:12.5px; color:#8a5a00; background:#fff6e0; border:1px solid #ffd98a; border-radius:6px; padding:9px 11px; margin:8px 0; font-weight:600; line-height:1.5;}
  /* ===== 🔍 Image preview lightbox ===== */
  .view-img-link{font-size:11.5px; color:var(--brand); font-weight:600; text-decoration:none; cursor:pointer; white-space:nowrap; background:none; border:none; padding:0; font-family:inherit;}
  .view-img-link:hover{text-decoration:underline;}
  .lightbox-overlay{display:none; position:fixed; inset:0; background:rgba(10,12,9,.82); z-index:2000; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;}
  .lightbox-overlay.show{display:flex;}
  .lightbox-overlay img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.4); cursor:default;}
  .lightbox-close{position:fixed; top:18px; right:22px; background:transparent; border:none; color:#fff; font-size:26px; cursor:pointer; z-index:2001; line-height:1;}
  #printArea{position:fixed; left:-9999px; top:0; width:700px; background:#fff; padding:36px; font-family:'Sarabun',sans-serif; color:#20281f;}
  #pHeaderBlock{padding:4px 8px 4px 4px; background:#fff;}
  #pFooterBlock{padding:4px 8px 4px 4px; background:#fff;}
  #printArea .day-block{padding:4px 4px 12px 4px; background:#fff;}
  #printArea .doc-header{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #FE6D43; padding-bottom:14px; margin-bottom:18px;}
  #printArea .doc-title{font-size:22px; font-weight:700; color:#222222; margin:0;}
  #printArea .doc-subtitle{font-size:13px; color:#686868; margin-top:3px;}
  #printArea .doc-id{font-size:12px; color:#686868; text-align:right;}
  #printArea .meta-box{background:#F6F7FB; border-radius:10px; padding:14px 16px; margin-bottom:18px; font-size:13px; display:grid; grid-template-columns:1fr 1fr; gap:6px 18px;}
  #printArea .meta-box .label{color:#686868; font-weight:600;}
  #printArea .day-title{font-size:15px; font-weight:700; background:#FE6D43; color:#fff; padding:6px 12px; border-radius:6px 6px 0 0; margin:20px 0 0;}
  #printArea .dir-title{font-size:13px; font-weight:700; color:#222222; margin:10px 0 3px;}
  #printArea h2{font-size:18px; margin:0 0 2px;}
  #printArea h3{font-size:14px; margin:16px 0 4px; color:#222222;}
  #printArea table{width:100%; border-collapse:collapse; font-size:12px; margin-top:4px;}
  #printArea th, #printArea td{border:1px solid #ddd; padding:6px 8px; text-align:left;}
  #printArea th{background:#eef2ec;}
  #printArea td.amt, #printArea th.amt{text-align:right;}
  #printArea .subtotal-row td{background:#fafafa; font-weight:600;}
  #printArea .grand-total-box{background:#222222; color:#fff; border-radius:10px; padding:14px 18px; margin-top:22px; display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:700;}
  /* ===== 📎 Evidence/receipt section (moved below the Grand Total bar) =====
     The actual PDF pagination is computed in JS (generatePdfBlob), since
     the document is assembled via html2canvas + jsPDF rather than the
     browser's native print pipeline — but these rules describe the same
     intent and apply if this markup is ever rendered/printed directly:
     each caption stays glued to its image, and photos are shown at about
     half page width instead of stretched edge-to-edge. */
  #printArea .evidence-section-title{page-break-before: always; break-before: page; font-size:15px; font-weight:700; color:#222; border-bottom:2px solid #222; padding-bottom:6px; margin:22px 0 12px;}
  #printArea .evidence-item{page-break-inside: avoid; break-inside: avoid; margin-bottom:16px;}
  #printArea .evidence-item .evidence-caption{font-size:12px; color:#555; margin-bottom:4px;}
  #printArea .evidence-item img{max-width:50%; width:50%; display:block; margin:0 auto;}
  #printArea .sign-area{display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:56px;}
  #printArea .sign-line{border-top:1px solid #888; padding-top:6px; font-size:12px; color:#686868; text-align:center;}
  .req{color:var(--danger);}

  /* ===== Stability patch: long text + small screens ===== */
  .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 > *, .segment-head > *, .day-header > * { min-width: 0; }
  label, .hint, .sub, .fuel-warn, .msg, .trip-section-title { overflow-wrap: anywhere; }
  .segment-head { gap: 8px; }
  .type-dropdown { flex: 1 1 auto; max-width: 100%; }
  .type-dropdown summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .type-options { max-width: min(360px, 90vw); }
  .total-box, .amount-line, .trip-total-line { flex-wrap: wrap; gap: 4px 12px; }
  .total-box .num { overflow-wrap: anywhere; }
  .attach-thumb { max-width: 100%; }
  #printArea table { table-layout: fixed; }
  #printArea th:nth-child(1) { width: 32px; }
  #printArea th:nth-child(2) { width: 130px; }
  #printArea th:nth-child(4) { width: 90px; }
  #printArea td { overflow-wrap: anywhere; }
  @media (max-width: 600px) {
    body { padding: 10px; }
    .grid2 { grid-template-columns: 1fr; }
    .card { padding: 14px; }
    .footer-actions .btn { flex: 1 1 100%; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ===== UI v3 — matches the design board. Colours live in :root below. ===== */
  :root{
    --brand:#FE6D43; --brand-text:#B4451F; --brand-soft:#FFF1E8;
    --ink:#1E1E1E; --muted:#5F5F5A; --line:#D9D9D6; --fill:#ECECE8; --bg:#F5F5F3; --surface:#FFFFFF;
    --ok:#1B6B3C; --ok-bg:#E3F4E8; --warn:#8A4B00; --warn-bg:#FFF1DE; --err:#A61B1B; --err-bg:#FDECEC; --info-bg:#EDEDEA;
    --brand-dark:#1E1E1E; --text:#1E1E1E; --border:#D9D9D6; --danger:#A61B1B;
  }
  body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif; font-size:15px; line-height:1.55; margin:0;}
  .wrap{max-width:820px; margin:0 auto; padding:40px 32px 64px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .muted{color:var(--muted);} .small{font-size:13px;}
  .grow{flex:1 1 0;}
  .ic{fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none;}
  .ic-muted{stroke:var(--muted);}
  a{color:var(--brand-text);} a:hover{color:#8A3416;}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px;}

  .page-head{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
  .page-head h1{margin:0; font-size:26px; color:var(--ink);}
  .page-head .sub{margin:4px 0 0; color:var(--muted); overflow-wrap:anywhere;}
  .draft-status{font-size:13px; color:var(--ok); font-weight:600; white-space:nowrap;}
  #pageBanner:empty, #msgArea:empty, #validationBox:empty{display:none;}
  #pageBanner, #msgArea, #validationBox{margin-bottom:16px;}

  .stack{display:flex; flex-direction:column; gap:20px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px; box-shadow:none; margin:0;}
  .card h2{margin:0 0 16px; font-size:18px; color:var(--ink); display:flex; align-items:center; gap:10px;}
  .card h2 .badge{display:inline-flex; width:28px; height:28px; padding:0; border-radius:999px; background:var(--brand); color:#fff; font-size:14px; font-weight:700; align-items:center; justify-content:center;}
  .card.fatal{max-width:520px; margin:60px auto 0; display:flex; flex-direction:column; gap:14px;}
  .card.fatal h2{margin:0;}

  label{display:block; font-size:14px; font-weight:600; margin:0; color:var(--ink);}
  .req{color:var(--err);}
  input, select, textarea{font:inherit; color:var(--ink);}
  input:not([type=checkbox]):not([type=file]), select{width:100%; box-sizing:border-box; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:15px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 1px var(--ink);}
  input.invalid{border:2px solid var(--err) !important; box-shadow:none;}
  input:disabled{background:var(--fill); color:var(--muted);}
  .grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  .fld{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .fld > label{font-size:13px; color:var(--muted);}
  .card .fld > label{font-size:14px; color:var(--ink);}
  .seg .fld > label{font-size:13px; color:var(--muted);}
  .fld-err{color:var(--err); font-size:13px; display:none;}
  .suffix-wrap{position:relative;}
  .suffix-wrap input{padding-right:46px !important;}
  .suffix{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; pointer-events:none;}
  .loading-status{display:none; align-items:center; gap:8px; font-size:13px; color:var(--muted);}
  .loading-status.show{display:flex;}

  /* buttons — white semi-bold text on brand orange (decision D4) */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn-primary:hover:not(:disabled){background:#E85A31; border-color:#E85A31;}
  .btn-outline{background:var(--surface); border-color:var(--line);}
  .btn-outline:hover{border-color:var(--ink);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-danger{background:transparent; border-color:var(--err); color:var(--err);}
  .btn-lg{min-height:48px; padding:0 28px; font-size:15px;}
  .btn-sm{min-height:36px; padding:0 12px;}
  .btn-block{width:100%;}
  .btn-copy{border:2px solid var(--ink);}
  .btn-dashed{width:100%; min-height:44px; border:1.5px dashed #BDBDB7; border-radius:10px; background:transparent; font:inherit; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer;}
  .btn-dashed:hover{border-color:var(--ink);}
  .icon-btn{width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; border:1px solid transparent; border-radius:10px; background:transparent; cursor:pointer; color:var(--ink);}
  .icon-btn.danger{color:var(--err);}
  .icon-btn:hover{background:var(--bg);}
  .link-danger{min-height:44px; padding:0 8px; border:none; background:none; color:var(--err); font:inherit; font-size:14px; font-weight:600; cursor:pointer;}

  /* banners */
  .banner{border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; overflow-wrap:anywhere;}
  .banner-err{background:var(--err-bg); color:var(--err);}
  .banner-warn{background:var(--warn-bg); color:var(--warn);}
  .banner-ok{background:var(--ok-bg); color:var(--ok);}
  .banner-info{background:var(--info-bg); color:var(--ink);}
  .banner-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .err-list{margin:6px 0 0; padding-left:20px;}
  .err-list a{color:var(--err);}

  /* locked sections (S1: choose a name first) */
  .lock-note{display:none; color:var(--muted); margin:0;}
  #formArea.is-locked #sec2, #formArea.is-locked #sec3, #formArea.is-all-locked #sec1{background:#FAFAF8; border-style:dashed;}
  #formArea.is-locked #sec2 .lock-note, #formArea.is-locked #sec3 .lock-note{display:block;}
  #formArea.is-locked #sec2 .unlock-only, #formArea.is-locked #sec3 .unlock-only, #formArea.is-locked .total-box{display:none;}
  #formArea.is-locked #sec2 h2, #formArea.is-locked #sec3 h2{color:var(--muted);}
  #formArea.is-sending #sec1, #formArea.is-sending #sec2, #formArea.is-sending .total-box{opacity:.45; pointer-events:none;}
  .skeleton{display:none; flex-direction:column; gap:10px;}
  .skeleton div{height:14px; border-radius:6px; background:var(--fill);}
  #formArea.is-loading #sec1 .skeleton{display:flex;}
  #formArea.is-loading #sec1 .grid2{display:none;}

  /* section 2: days & segments */
  .day{border:1px solid var(--line); border-radius:14px; background:#F7F7F5; padding:16px; display:flex; flex-direction:column; gap:18px; margin-bottom:16px;}
  .day-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}

  .day-divider{height:1px; background:var(--line);}
  .dir{display:flex; flex-direction:column; gap:10px;}
  .dir-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .dir-head h4{margin:0; font-size:16px;}
  .dir-head b{color:var(--ink);}
  .seg{border:1px solid var(--line); border-radius:12px; background:var(--surface);}
  .seg.has-error{border:2px solid var(--err);}
  .seg-head{position:relative; display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; padding:12px 16px; background:#FAFAF8; border-bottom:1px solid var(--line); border-radius:12px 12px 0 0;}
  .seg-head:last-child{border-bottom:none; border-radius:12px;}
  .seg-no{height:44px; display:flex; align-items:center; font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap;}
  .type-picker{position:relative; flex:1 1 240px; min-width:0; max-width:360px;}
  .type-btn{width:100%; min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font:inherit; font-weight:600; color:var(--ink); cursor:pointer; text-align:left;}
  .type-btn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .type-btn.empty{color:var(--muted);}
  .type-btn.open{border:2px solid var(--ink);}
  .type-menu{position:absolute; left:0; top:calc(100% + 6px); z-index:30; width:560px; max-width:calc(100vw - 48px); box-sizing:border-box; padding:8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 28px rgba(0,0,0,.16); display:flex; flex-direction:column; gap:6px;}
  .tm-search{position:relative; display:flex; align-items:center;}
  .tm-search .ic{position:absolute; left:12px;}
  .tm-search input{min-height:40px !important; padding-left:36px !important; background:var(--bg) !important;}
  .tm-cols{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
  .tm-head{padding:8px 10px 4px; font-size:12px; font-weight:700; color:var(--muted);}
  .tm-opt{width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:7px 10px; border:none; border-radius:8px; background:transparent; font:inherit; color:var(--ink); text-align:left; cursor:pointer;}
  .tm-opt:hover{background:var(--bg);}
  .tm-opt.active{background:var(--ink); color:#fff; font-weight:600;}
  .amt-fld{width:168px; flex:none;}
  .seg-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:14px;}
  .seg-note{margin:0; font-size:13px; color:var(--muted);}
  .route{display:grid; grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr); gap:10px; align-items:start;}
  .route.has-km{grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr) 150px;}
  .route-arrow{height:44px; margin-top:26px; display:flex; align-items:center; justify-content:center;}
  .attach{display:flex; flex-direction:column; gap:8px;}
  .attach-label{font-size:13px; font-weight:600; color:var(--muted);}
  .attach-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start;}
  .attach-add{height:64px; padding:0 16px; border:1.5px dashed #BDBDB7; border-radius:10px; background:var(--surface); display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer;}
  .attach-add:hover{border-color:var(--ink);}
  .attach-add input{position:absolute; width:1px; height:1px; opacity:0;}
  .thumb{position:relative; width:64px; height:64px; border-radius:8px; border:1px solid var(--line); background:var(--fill); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); text-align:center;}
  .thumb-view{padding:0; border:none; background:none; width:100%; height:100%; cursor:zoom-in;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb-rm{position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:999px; border:none; background:rgba(30,30,30,.75); color:#fff; font-size:11px; cursor:pointer; line-height:22px; padding:0;}
  .thumb-badge{position:absolute; left:2px; bottom:2px; font-size:10px; font-weight:700; background:var(--ok-bg); color:var(--ok); border-radius:999px; padding:0 6px;}
  .thumb-pdf{flex-direction:column; gap:2px; padding:4px; box-sizing:border-box;}
  .thumb-pdf-icon{font-weight:700; color:var(--err);}
  .thumb-name{font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:56px;}
  .thumb-loading{font-size:10px; padding:4px;}

  /* total + section 3 */
  .total-box{background:var(--ink); color:#fff; border-radius:14px; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin:0;}
  .total-box .num{font-size:24px; font-weight:700; overflow-wrap:anywhere;}
  textarea.summary-preview{width:100%; box-sizing:border-box; min-height:260px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#FAFAF8; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.6; white-space:pre; overflow-x:auto; resize:vertical;}
  .copy-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:10px 0 0;}
  .copy-hint{display:none; font-size:14px; color:var(--ok); font-weight:600;}
  .actions{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:16px; margin-top:16px;}
  .send-fail .actions{border-top:none; padding-top:0; margin-top:12px;}
  .send-fail{border-top:1px solid var(--line); padding-top:16px; margin-top:16px;}
  .sending{display:flex; align-items:center; gap:12px;}
  .spin{fill:none; stroke-width:3; stroke-linecap:round; animation:spin .9s linear infinite; flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* dropdown list for names / stations */
  .combo-box{position:absolute; z-index:60; margin:0; padding:6px; list-style:none; box-sizing:border-box; max-height:320px; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 28px rgba(0,0,0,.16); display:none; font-size:15px;}
  .combo-box li{padding:9px 12px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer;}
  .combo-box li:hover{background:var(--bg);}
  .combo-box li.active{background:var(--ink); color:#fff;}
  .combo-box li.active .combo-sub{color:#E0E0DC;}
  .combo-sub{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); white-space:nowrap;}
  .combo-tag{font-size:11px; font-weight:700; border-radius:999px; padding:1px 8px; background:var(--ok-bg); color:var(--ok);}
  .combo-box li.active .combo-tag{background:#3A3A3A; color:#fff;}
  .combo-box li.combo-empty{color:var(--muted); cursor:default; display:block; font-size:14px;}
  .combo-box li.combo-empty:hover{background:none;}

  /* modal + toast */
  .modal-overlay{position:fixed; inset:0; z-index:100; background:rgba(20,20,20,.45); display:flex; align-items:flex-start; justify-content:center; padding:96px 20px 20px; overflow:auto;}
  .modal{width:100%; max-width:480px; background:var(--surface); border-radius:14px; padding:28px; box-shadow:0 16px 40px rgba(0,0,0,.25); display:flex; flex-direction:column; gap:14px;}
  .modal h2{margin:0; font-size:21px;}
  .modal-body p{margin:0 0 6px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;}
  .modal-actions.stacked{flex-direction:column;}
  .modal-actions.split > .btn{flex:1 1 180px;}
  .success{text-align:left;}
  .success-mark{width:56px; height:56px; border-radius:999px; background:var(--ok-bg); color:var(--ok); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; align-self:center;}
  .success h2{text-align:center;}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:0; background:var(--bg); border-radius:12px; padding:14px 16px;}
  .kv dt{color:var(--muted); font-size:14px;} .kv dd{margin:0; font-weight:700;}
  .undo-toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); z-index:90; display:flex; align-items:center; gap:16px; background:var(--ink); color:#fff; border-radius:12px; padding:12px 16px; box-shadow:0 12px 32px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:calc(100vw - 32px);}
  .undo-toast.show{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0);}
  .undo-toast button{min-height:36px; padding:0 14px; border-radius:8px; border:1px solid #fff; background:transparent; color:#fff; font:inherit; font-weight:700; cursor:pointer;}

  @media (max-width: 640px){
    .wrap{padding:20px 14px 48px;}
    .grid2{grid-template-columns:1fr;}
    .card{padding:16px;}
    .route, .route.has-km{grid-template-columns:1fr;}
    .route-arrow{display:none;}
    .amt-fld{width:100%;}
    .type-picker{max-width:none;}
    .tm-cols{grid-template-columns:1fr;}
  }
</style>
<style>
  .spin-sm{width:14px; height:14px; border-radius:50%; border:2px solid var(--fill); border-top-color:var(--ink); animation:spin .7s linear infinite; flex:none;}

<div class="wrap">

<div id="modalRoot"></div>

// Formats a Date object as a LOCAL calendar date string (YYYY-MM-DD),
// using getFullYear/getMonth/getDate rather than toISOString(). This
// matters because toISOString() converts to UTC first — in a UTC+
// timezone (e.g. Thailand, UTC+7), local midnight can be reported as the
// PREVIOUS day once converted to UTC, silently shifting "today" back by
// one day right around midnight.
function localISODate(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
  return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

// existing-receipt Base64 images for the currently loaded submission (see
// loadSubmissionAttachmentImages). generatePdfBlob() awaits this before

// Per-day Gasohol 91 price (+ receipt image, for the PDF) as entered by
// the event admin in index.html. Loaded once from apiGetEventInfo and used
// for the personal-vehicle auto-calculation below — there is no manual
// fuel-price input on this form anymore.
let eventFuelPrices = []; // [{ date:'YYYY-MM-DD', price:Number, receiptImage:{base64,...}|null, receiptUrl }]

// Returns the full fuel-price entry that applies to a given travel date:
// an exact match if one exists, otherwise the closest *previous* event
// date's entry (falls back to the earliest available entry if the travel
// date is before every recorded price).
function getFuelPriceEntryForDate(dateStr){
  if(!dateStr || eventFuelPrices.length === 0) return null;
  const exact = eventFuelPrices.find(fp => fp.date === dateStr);
  if(exact) return exact;
  const prior = eventFuelPrices.filter(fp => fp.date < dateStr).sort((a,b)=> b.date.localeCompare(a.date));
  if(prior.length > 0) return prior[0];
  const sorted = eventFuelPrices.slice().sort((a,b)=> a.date.localeCompare(b.date));
  return sorted.length ? sorted[0] : null;
}

function getFuelPriceForDate(dateStr){
  const entry = getFuelPriceEntryForDate(dateStr);
  return entry ? (Number(entry.price) || 0) : 0;
}

// Fuel-price receipt photos are only ever needed at PDF-generation time
// (embedded as proof alongside "Personal Vehicle" travel days), so
// apiGetEventInfo intentionally does NOT send them on page load — this
// fetches them just-in-time, right before building the PDF, and only if
// this claim actually uses "Personal Vehicle" on at least one day and the
// images haven't already been loaded this session.
async function ensureFuelReceiptImagesLoaded(){
  const needsFuelReceipts = state.days.some(day =>
    [...day.outboundSegments, ...day.returnSegments].some(seg => {
      const typeCfg = SEGMENT_TYPES.find(t=>t.value===seg.type);
      return typeCfg && typeCfg.kind==='car';
    })
  );
  if(!needsFuelReceipts) return;

  const alreadyLoaded = eventFuelPrices.every(fp => !fp.receiptUrl || fp.receiptImage);
  if(alreadyLoaded) return;

  try{
    const res = await callApi('getFuelReceiptImages', { eventId: EVENT_ID });
    if(res && res.ok && Array.isArray(res.fuelPrices)){
      const imageByDate = {};
      res.fuelPrices.forEach(fp => { imageByDate[fp.date] = fp.receiptImage; });
      eventFuelPrices.forEach(fp => {
        if(imageByDate[fp.date] !== undefined) fp.receiptImage = imageByDate[fp.date];
      });
    } else {
      // The call reached the server but came back unsuccessful (or with
      // an unexpected shape) — log the actual response so this is
      // diagnosable instead of silently leaving every receipt un-loaded.
      console.error('getFuelReceiptImages returned an unexpected response:', res);
    }
  }catch(err){
    // Non-fatal — the PDF will just note "no receipt on file" for that
    // date instead of embedding a photo.
    console.error('Failed to load fuel receipt images:', err);
  }
}

function newSegment(){ return { type:'', origin:'', destination:'', distanceKm:'', amount:0, otherDescription:'', attachments:[], attachmentUrls:[] }; }
function newDay(date){ return { date: date || '', outboundSegments:[newSegment()], returnSegments:[newSegment()] }; }

// True for any attachment that's a PDF file (evidence documents like an
// itemized e-receipt) rather than a photo — these get a filename+icon
// thumbnail instead of an <img> preview, and are merged onto the end of
// the generated PDF at export time instead of being rendered as an image.
function isPdfAttachment(att){
  if(!att) return false;
  if(att.mimeType === 'application/pdf') return true;
  return /^data:application\/pdf/i.test(att.base64 || '');
}

function escapeAttr(str){
  return String(str==null?'':str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function daysToTripsArray(days){

  });
  return arr;
}

// Strips the (potentially large) base64 image data from any attachment
// already flagged isExisting before the trip details go into the submit
// payload — the server only ever needs existingUrl for those (see
// apiSubmitExpense), never re-uploads them, and the base64 was only ever
// fetched client-side for local preview/PDF-embedding purposes. Sending it
// back up serves no purpose and needlessly bloats the request, which
// matters most on a resubmit with several existing photos.
function stripExistingBase64ForSubmit(trips){
  return trips.map(trip => ({
    ...trip,
    segments: (trip.segments||[]).map(seg => ({
      ...seg,
      attachments: (seg.attachments||[]).map(att =>
        att && att.isExisting
          ? { isExisting:true, existingUrl: att.existingUrl }
          : att
      )
    }))
  }));
}

    const returnTrip = trips[k+1] || {};
    days.push({
      date: outboundTrip.date || returnTrip.date || '',
      outboundSegments: normalizeLoadedSegments(outboundTrip.segments),
      returnSegments: normalizeLoadedSegments(returnTrip.segments)
    });
  }
  return days.length ? days : [newDay()];
}

// Ensures every segment coming back from a previously submitted report has
// the full set of fields the form/PDF generator expect. Existing receipts
// now arrive from the server (apiGetMySubmission) as plain URLs only — the
// actual Base64 image data streams in afterward via a background call to
// getSubmissionAttachmentImages (see onEmployeeChange) — so each one starts
// as a lightweight loading placeholder (isExisting + existingUrl, base64
// null) and gets filled in once the real image arrives, instead of the
// whole form waiting on every old photo to be re-fetched from Drive first.
function normalizeLoadedSegments(segments){
  if(!segments || !segments.length) return [newSegment()];
  return segments.map(seg => {
    const urls = Array.isArray(seg.attachmentUrls) ? seg.attachmentUrls : [];
    const attachments = urls.map(url => ({ isExisting:true, existingUrl:url, base64:null, fileName:'', mimeType:'' }));
    return Object.assign(newSegment(), seg, {
      attachments: attachments,
      // Superseded by `attachments` above — each existing receipt now
      // carries its own `existingUrl`, so we don't also keep the raw URL
      // list here (that would make the backend see it twice on resubmit).
      attachmentUrls: []
    });
  });
}

/* =========================================================
   ฟังก์ชันคำนวณราคาตั๋วรถไฟฟ้า (railFare)
   ========================================================= */
function railFare(line, origin, destination) {
  const cfg = RAIL_LINES[line];
  if (!cfg || !origin || !destination || origin === destination) return 0;

  const i = cfg.stations.indexOf(origin);
  const j = cfg.stations.indexOf(destination);
  if (i < 0 || j < 0) return 0;

  const dist = Math.abs(i - j);

  if (line === 'BTS_GREEN') {
    const idx = i * BTS_GREEN_N + j;
    return BTS_GREEN_MATRIX_FLAT[idx] || BTS_GREEN_MATRIX_FLAT[0];
  }
  if (line === 'SRT_RED') {
    const idx = i * SRT_RED_N + j;
    return SRT_RED_MATRIX_FLAT[idx] || SRT_RED_MATRIX_FLAT[0];
  }
  if (line === 'MRT_BLUE') {
    const idx = i * MRT_BLUE_N + j;
    return MRT_BLUE_MATRIX_FLAT[idx] || MRT_BLUE_MATRIX_FLAT[0];
  }
  if (line === 'MRT_PURPLE') {
    const idx = i * MRT_PURPLE_N + j;
    return MRT_PURPLE_MATRIX_FLAT[idx] || MRT_PURPLE_MATRIX_FLAT[0];
  }
  if (line === 'BTS_YELLOW') {
    const idx = i * BTS_YELLOW_N + j;
    return BTS_YELLOW_MATRIX_FLAT[idx] || BTS_YELLOW_MATRIX_FLAT[0];
  }
  if (line === 'BTS_PINK') {
    const idx = i * BTS_PINK_N + j;
    return BTS_PINK_MATRIX_FLAT[idx] || BTS_PINK_MATRIX_FLAT[0];
  }
  if (cfg.flatRate) {
    return cfg.flatRate;
  }
  if (cfg.fareTable) {
    return dist < cfg.fareTable.length ? cfg.fareTable[dist] : cfg.fareTable[cfg.fareTable.length - 1];
  }

  const calculated = cfg.base + ((dist - 1) * cfg.step);
  return Math.min(Math.round(calculated), cfg.max);
}

function getSelectableStations(line){
  const cfg = RAIL_LINES[line];
  if(!cfg || !cfg.stations) return [];
  if(line === 'BTS_GREEN'){
    return cfg.stations.filter((s,idx)=>idx !== BTS_GREEN_FUTURE_INDEX);
  }
  return cfg.stations;
}

function isValidStation(line, name){
  if(!name) return true;
  const cfg = RAIL_LINES[line];
  return !!(cfg && cfg.stations && cfg.stations.includes(name));
}

function stationDatalistOptions(line){
  return getSelectableStations(line).map(s=>`<option value="${s}">`).join('');
}

// Fetches the real Base64 images for every existing-receipt placeholder
// currently in state.days (see normalizeLoadedSegments) and patches them
// in once they arrive, re-rendering so the "กำลังโหลดรูป..." placeholders
// are replaced with real thumbnails. generatePdfBlob() awaits the promise
// this returns before building a PDF, so a resubmit can never embed a
// still-loading (null) image even if triggered mid-fetch.
async function loadSubmissionAttachmentImages(employeeName){
  try{
    const res = await callApi('getSubmissionAttachmentImages', { eventId: EVENT_ID, employeeName });
    // The person may have already switched to a different employee name
    // by the time this slow background fetch resolves — if so, discard
    // the result instead of patching images into what is now someone
    // else's loaded segments.
    if(employeeName !== lastLoadedEmployeeName) return;
    if(!res || !res.ok || !res.images) return;
    let changed = false;
    state.days.forEach(day=>{
      ['outboundSegments','returnSegments'].forEach(key=>{
        day[key].forEach(seg=>{
          (seg.attachments||[]).forEach(att=>{
            if(att.isExisting && !att.base64 && att.existingUrl && res.images[att.existingUrl]){
              Object.assign(att, res.images[att.existingUrl], { isExisting:true, existingUrl: att.existingUrl });
              changed = true;
            }
          });
        });
      });
    });
    if(changed) render();
  }catch(err){
    // Non-fatal — thumbnails just stay as loading placeholders; the
    // person can still fill in/submit the rest of the form normally.
    console.error('Failed to load existing attachment images:', err);
  }
}

// Amount = (Distance / 15) * Gasohol 91 price of that travel date — with
// the closest-previous-event-date fallback baked into getFuelPriceForDate().
function recalcSegment(seg, date){
  const typeCfg = SEGMENT_TYPES.find(t=>t.value===seg.type);
  if(typeCfg.kind==='rail'){
    seg.amount = railFare(seg.type, seg.origin, seg.destination);
  } else if(typeCfg.kind==='car'){
    const price = getFuelPriceForDate(date);
    const dist = parseFloat(seg.distanceKm)||0;
    seg.amount = Math.round((dist/15*price)*100)/100;
  } else if(typeCfg.kind==='none'){
    // "ไม่เบิกค่าเดินทาง" (No Expense Claim) — always exactly 0.00, no
    // manual amount entry and no receipt required for this segment.
    seg.amount = 0;
  }
}

// Compresses/resizes a freshly-picked receipt photo before it ever enters
// the form state — this is what keeps uploads, the Drive round-trip, and
// PDF generation fast even for full-resolution phone camera shots (often
// ~5MB) by shrinking them down to a web-friendly size up front. PDF
// evidence files are left untouched (no compression applies) and are
// merged onto the end of the generated PDF at export time instead of
// being rendered as an image — see generatePdfBlob().
function compressImageForUpload(file){
  // Receipts have small print: keep enough pixels and quality to stay readable
  // when printed, while still shrinking 12-megapixel phone photos.
  const MAX_DIM = 2000;
  const JPEG_QUALITY = 0.92;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      if(isPdf){
        resolve({ base64: e.target.result, fileName: file.name, mimeType: 'application/pdf' });
        return;
      }
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > MAX_DIM || height > MAX_DIM){
          const scale = MAX_DIM / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve({ base64: canvas.toDataURL('image/jpeg', JPEG_QUALITY), fileName: file.name, mimeType: 'image/jpeg' });
      };
      img.onerror = ()=>{
        // Not a browser-renderable format (e.g. HEIC) — fall back to the
        // original bytes untouched so the upload still goes through; the
        // PDF generator already shows a friendly note if it can't render it.
        resolve({ base64: e.target.result, fileName: file.name, mimeType: file.type });
      };
      img.src = e.target.result;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

  render();
}

function fmt(n){ return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2}); }

function segmentLine(seg, dateStr){
  const typeCfg = SEGMENT_TYPES.find(t=>t.value===seg.type);
  const amt = fmt(seg.amount);
  if(typeCfg.kind==='none'){
    return `เดินทางด้วย ${typeCfg.label} (ไม่มีการเบิกค่าใช้จ่าย) ราคา ${amt} บาท`;
  }
  if(typeCfg.kind==='car'){
    // Detailed fuel-calculation formula placed after the destination and
    // before the final amount, e.g.:
    // "เดินทางด้วยรถยนต์ส่วนตัว จาก ออฟฟิศ - ไป สถานที่จัดงาน 80.00/15x35.62 = 189.97 บาท"
    // Distance, fuel price, and amount are all strictly forced to 2 decimals.
    const distance = Number(seg.distanceKm||0).toFixed(2);
    const price = getFuelPriceForDate(dateStr).toFixed(2);
    const amount = (Number(seg.amount)||0).toFixed(2);
    return `เดินทางด้วยรถยนต์ส่วนตัว จาก ${seg.origin||'-'} - ไป ${seg.destination||'-'} ${distance}/15x${price} = ${amount} บาท`;
  }
  if(seg.type==='PARKING'){
    return `เดินทางด้วย ${typeCfg.label} ราคา ${amt} บาท`;
  }
  if(seg.type==='TOLL'){
    if(!seg.origin && !seg.destination){
      return `เดินทางด้วย ${typeCfg.label} ราคา ${amt} บาท`;
    }
    return `เดินทางด้วย ${typeCfg.label} จาก ${seg.origin||'-'} ไป ${seg.destination||'-'} ราคา ${amt} บาท`;
  }
  const label = (seg.type==='OTHER' && seg.otherDescription) ? `อื่นๆ (${seg.otherDescription})` : typeCfg.label;
  return `เดินทางด้วย ${label} จาก ${seg.origin||'-'} ไป ${seg.destination||'-'} ราคา ${amt} บาท`;
}

function formatThaiDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString('th-TH', {day:'2-digit', month:'2-digit', year:'numeric'});
}

  const dept = document.getElementById('department').value.trim();
  lines.push(`${empName || '-'} - ${dept || '-'}`);

    lines.push(`[${dateLabel || 'ไม่ระบุวันที่'}]`);

    let outTotal = 0;

  });

  lines.push(`ยอดรวมการเดินทางทั้งหมด: ${fmt(total)} บาท`);

function waitForImages(container){

  return Promise.all(imgs.map(img=>{

// Draws a short text block straight onto a canvas. Same size/padding as the
// old html2canvas version (which cloned the whole page on every call and
// made PDFs with many receipts slow).
const _segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
async function drawTextBlock(text, o){
  const SCALE = 2;
  const wrapEl = document.getElementById('pDaysWrap');
  const width = Math.max(200, (wrapEl && wrapEl.clientWidth) || 700);
  const font = `${o.weight || 400} ${o.size}px Sarabun, sans-serif`;
  try{ if(document.fonts && document.fonts.load) await document.fonts.load(font, text); }catch(e){}
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = font;
  const maxW = width - o.padX * 2;
  const pieces = _segmenter ? Array.from(_segmenter.segment(String(text)), x => x.segment) : String(text).split(/(\s+)/);
  const lines = []; let line = '';
  pieces.forEach(piece => {
    if(measure.measureText(line + piece).width <= maxW || !line){
      if(measure.measureText(piece).width > maxW && !line){ // one very long piece: split by character
        for(const ch of piece){ if(measure.measureText(line + ch).width > maxW && line){ lines.push(line); line = ch; } else line += ch; }
      } else line += piece;
    } else { lines.push(line.trimEnd()); line = piece.trimStart(); }
  });
  if(line) lines.push(line);
  const lineH = Math.round(o.size * 1.5);
  const height = o.padTop + lines.length * lineH + o.padBottom + (o.underline ? 2 : 0);
  const canvas = document.createElement('canvas');
  canvas.width = width * SCALE; canvas.height = height * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
  ctx.font = font; ctx.fillStyle = o.color; ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => ctx.fillText(ln, o.padX, o.padTop + i * lineH + lineH / 2));
  if(o.underline){ ctx.fillStyle = o.color; ctx.fillRect(0, height - 2, width, 2); }
  return canvas;
}

async function captureCaptionLabel(text){
  return drawTextBlock(text, { size:12, color:'#555555', padX:4, padTop:2, padBottom:2 });
}

async function captureSectionTitle(text){

function guessImageFormat(mimeType, dataUrl){
  const src = (mimeType || '').toLowerCase() || (/^data:image\/([a-zA-Z0-9.+-]+);/.exec(dataUrl||'')||[])[1] || '';
  if(src.includes('png')) return 'PNG';
  if(src.includes('webp')) return 'WEBP';
  if(src.includes('jpeg') || src.includes('jpg')) return 'JPEG';
  return 'JPEG';
}

function getImageNaturalSize(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>resolve({ width: img.naturalWidth || 800, height: img.naturalHeight || 600 });
    img.onerror = ()=>resolve({ width: 800, height: 600 });
    img.src = dataUrl;
  });
}

// ---- Existing (already-uploaded) receipt images ----
// normalizeLoadedSegments() folds each existing receipt's URL straight
// into seg.attachments as a lightweight isExisting/existingUrl placeholder
// (base64 starts null); loadSubmissionAttachmentImages() then fetches the
// real Base64 in the background and patches it in once ready — see
// onEmployeeChange. generatePdfBlob() awaits that fetch (via
// submissionImagesLoadPromise) before this loop runs, so by the time we
// get here every attachment's base64 is guaranteed to be populated and
// "existing" vs "newly-picked" receipts go through the exact same code
// path below either way.

async function generatePdfBlob(){
  if(submissionImagesLoadPromise) await submissionImagesLoadPromise;
  await ensureFuelReceiptImagesLoaded();
  const total = updateTotals();
  buildPrintArea(total);

  const el = document.getElementById('printArea');
  await waitForImages(el);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const pageWidth = 210, pageHeight = 297, margin = 10;
  const contentWidth = pageWidth - margin * 2;
  const maxBlockHeight = pageHeight - margin * 2;
  const BLOCK_GAP = 6;
  let cursorY = margin;
  let firstBlock = true;
  let forceNewPage = false;

  const prevPosition = el.style.position, prevLeft = el.style.left, prevZ = el.style.zIndex;
  el.style.position = 'fixed';
  el.style.left = '0';
  el.style.top = '0';
  el.style.zIndex = '99999';

  function placeImage(imgData, format, imgHeight){
    if(imgHeight > maxBlockHeight){
      if(!firstBlock) doc.addPage();
      let heightLeft = imgHeight, sliceOffset = 0;
      while(heightLeft > 0){
        if(sliceOffset > 0) doc.addPage();
        doc.addImage(imgData, format, margin, margin - sliceOffset, contentWidth, imgHeight);
        const drawn = Math.min(heightLeft, maxBlockHeight);
        heightLeft -= drawn; sliceOffset += drawn;
      }
      firstBlock = false;
      forceNewPage = true;
      return;
    }
    if(forceNewPage || (!firstBlock && cursorY + imgHeight > pageHeight - margin)){
      doc.addPage(); cursorY = margin; forceNewPage = false;
    }
    doc.addImage(imgData, format, margin, cursorY, contentWidth, imgHeight);
    cursorY += imgHeight + BLOCK_GAP;
    firstBlock = false;
  }

  async function placeCapturedBlock(blockEl, quality){
    const canvas = await html2canvas(blockEl, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    placeImage(canvas.toDataURL('image/jpeg', quality), 'JPEG', (canvas.height * contentWidth) / canvas.width);
  }

  function compressPhotoForPdf(dataUrl){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>{
        const MAX_DIM = 1400;
        let { width, height } = img;
        if(width > MAX_DIM || height > MAX_DIM){
          const scale = MAX_DIM / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.95), width, height });
      };
      img.onerror = ()=>resolve({ dataUrl, width: 800, height: 600 });
      img.src = dataUrl;
    });
  }

  // Evidence photos are shown at roughly half the page width, centered,
  // instead of stretched edge-to-edge across the full A4 page. Rendered
  // PDF pages use the full content width instead (see PDF_PAGE_WIDTH_RATIO
  // below) — they're already document-shaped, so unlike a photo they
  // benefit from being shown as large as fits rather than deliberately
  // shrunk down.
  const EVIDENCE_IMG_WIDTH_RATIO = 0.75;
  const PDF_PAGE_WIDTH_RATIO = 1.0;

  // Shared placement primitive: draws a caption label directly above a
  // piece of evidence (an image or a rendered PDF page), scaled to fit
  // within the standard A4 printable margins (contentWidth/maxBlockHeight
  // — i.e. the page minus its margins), auto-shrinking further if the
  // natural aspect ratio would otherwise overflow the page height.
  //
  // Caption + evidence are kept together as ONE atomic unit — the
  // equivalent of CSS `page-break-inside: avoid` for this canvas-based PDF
  // pipeline (html2canvas/jsPDF don't honor real CSS pagination, so the
  // "stay together" guarantee is enforced here in JS instead): if the pair
  // doesn't fit in the remaining space on the current page, a new page
  // starts BEFORE either one is drawn, so the caption sentence can never
  // end up separated from its evidence across a page break.
  async function placeEvidenceBlock(caption, imgDataUrl, format, naturalWidth, naturalHeight, widthRatio){
    const labelCanvas = await captureCaptionLabel(caption);
    const labelImgData = labelCanvas.toDataURL('image/jpeg', 0.92);
    const labelHeight = (labelCanvas.height * contentWidth) / labelCanvas.width;

    let w = contentWidth * widthRatio;
    let h = (naturalHeight * w) / naturalWidth;
    const maxContentH = maxBlockHeight - labelHeight - BLOCK_GAP * 2;
    if(h > maxContentH){ h = maxContentH; w = (naturalWidth * h) / naturalHeight; }
    const xOffset = margin + (contentWidth - w) / 2; // center horizontally

    const combinedHeight = labelHeight + BLOCK_GAP + h;
    if(forceNewPage || (!firstBlock && cursorY + combinedHeight > pageHeight - margin)){
      doc.addPage(); cursorY = margin; forceNewPage = false;
    }

    doc.addImage(labelImgData, 'JPEG', margin, cursorY, contentWidth, labelHeight);
    cursorY += labelHeight + BLOCK_GAP;
    firstBlock = false;

    try{
      doc.addImage(imgDataUrl, format, xOffset, cursorY, w, h);
      cursorY += h + BLOCK_GAP;
    }catch(err){
      const noteCanvas = await captureCaptionLabel('⚠️ ไม่สามารถแสดงรูปนี้ในเอกสารได้ (ไฟล์ภาพรูปแบบไม่รองรับ เช่น HEIC) - โปรดแนบเป็น JPG/PNG แทน');
      placeImage(noteCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', (noteCanvas.height * contentWidth) / noteCanvas.width);
    }
  }

  async function placeOriginalPhoto(att, caption){
    // The photo was already resized once when attached — re-encoding it again
    // here only loses detail, so it goes into the PDF as-is.
    const shouldCompress = false;
    let photoData = att.base64;
    let format = guessImageFormat(att.mimeType, att.base64);
    let naturalSize;

    if(shouldCompress){
      const compressed = await compressPhotoForPdf(att.base64);
      photoData = compressed.dataUrl;
      format = 'JPEG';
      naturalSize = { width: compressed.width, height: compressed.height };
    } else {
      naturalSize = await getImageNaturalSize(att.base64);
    }

    await placeEvidenceBlock(caption, photoData, format, naturalSize.width, naturalSize.height, EVIDENCE_IMG_WIDTH_RATIO);
  }

  // Renders every page of an uploaded PDF evidence file into its own
  // image (via pdf.js), so each page can be captioned and placed inline
  // in the evidence flow exactly like a photo — auto-scaled to fit within
  // the A4 printable margins (see PDF_PAGE_WIDTH_RATIO/placeEvidenceBlock)
  // instead of overflowing or clipping.
  async function placePdfEvidence(att, caption){
    const bytes = dataUriToUint8Array(att.base64);
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    const RENDER_SCALE = 2; // crisp enough for print without ballooning file size
    for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: RENDER_SCALE });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const pageCaption = pdf.numPages > 1 ? `${caption} (PDF หน้า ${pageNum}/${pdf.numPages})` : `${caption} (PDF)`;
      await placeEvidenceBlock(pageCaption, canvas.toDataURL('image/jpeg', 0.92), 'JPEG', canvas.width, canvas.height, PDF_PAGE_WIDTH_RATIO);
    }
  }

  // Places one evidence-queue entry, whichever kind it is: a still-missing
  // receipt just gets its caption note, a PDF gets every page rendered and
  // placed in sequence, everything else goes through the normal photo path.
  async function placeEvidenceItem({ att, caption, isPdf }){
    if(!att || !att.base64){
      const noteCanvas = await captureCaptionLabel(caption);
      placeImage(noteCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', (noteCanvas.height * contentWidth) / noteCanvas.width);
      return;
    }
    if(isPdf){
      try{
        await placePdfEvidence(att, caption);
      }catch(err){
        console.error('Failed to render PDF evidence "' + (att.fileName||'') + '": ' + err);
        const noteCanvas = await captureCaptionLabel(caption + ' (⚠️ ไม่สามารถแสดงไฟล์ PDF นี้ได้ในเอกสาร กรุณาตรวจสอบไฟล์)');
        placeImage(noteCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', (noteCanvas.height * contentWidth) / noteCanvas.width);
      }
      return;
    }
    await placeOriginalPhoto(att, caption);
  }

  try{
    await placeCapturedBlock(document.getElementById('pHeaderBlock'), 0.92);

    // Evidence photos (travel receipts) and rendered PDF evidence pages
    // are no longer placed inline per-day — they're collected here in
    // order and placed as one section AFTER the Grand Total bar instead
    // (see below). Fuel-price receipts (uploaded by the event admin, not
    // the staff member) are collected into their own separate queue so
    // they can be placed as a distinct FINAL sub-section, after every
    // travel-evidence item — never interleaved day-by-day the way they
    // used to be.
    const travelEvidenceQueue = [];
    const fuelEvidenceQueue = [];

    for(const dayBlockEl of Array.from(document.querySelectorAll('#pDaysWrap > .day-block'))){
      await placeCapturedBlock(dayBlockEl, 0.92);

      const di = parseInt(dayBlockEl.dataset.dayIndex, 10);
      const day = state.days[di];
      const segmentsWithDir = [
        ...day.outboundSegments.map(seg=>({ seg, dirLabel: 'ขาไป' })),
        ...day.returnSegments.map(seg=>({ seg, dirLabel: 'ขากลับ' }))
      ];
      for(const { seg, dirLabel } of segmentsWithDir){
        const typeCfg = SEGMENT_TYPES.find(t=>t.value===seg.type);
        let typeAndRoute;
        if(typeCfg.kind==='car'){
          // Same formula pattern as the trip table / copy-summary text:
          // "จาก [Origin] - ไป [Destination] [Distance]/15x[FuelPrice] = [Amount] บาท"
          const distance = Number(seg.distanceKm||0).toFixed(2);
          const price = getFuelPriceForDate(day.date).toFixed(2);
          const amount = (Number(seg.amount)||0).toFixed(2);
          typeAndRoute = `จาก ${seg.origin||'-'} - ไป ${seg.destination||'-'} ${distance}/15x${price} = ${amount} บาท`;
        } else {
          const typeLabel = (seg.type==='OTHER' && seg.otherDescription) ? `อื่นๆ (${seg.otherDescription})` : typeCfg.label;
          const tollEmpty = seg.type==='TOLL' && !seg.origin && !seg.destination;
          const routeSuffix = (seg.type==='PARKING' || tollEmpty) ? '' : ` (${seg.origin||'-'} → ${seg.destination||'-'})`;
          typeAndRoute = `${typeLabel}${routeSuffix}`;
        }

        // seg.attachments now uniformly holds every receipt for this
        // segment — files picked in this session AND receipts pulled back
        // from a previous submission (already Base64, tagged isExisting by
        // normalizeLoadedSegments/driveFileToBase64Attachment_). One loop,
        // one render path, no Drive fetch at export time. PDF attachments
        // stay in the SAME queue, in their original position — they get
        // rendered page-by-page and placed inline via placeEvidenceItem,
        // not appended separately at the end.
        for(const att of (seg.attachments||[])){
          const caption = `📎 หลักฐาน${att.isExisting ? ' (ไฟล์เดิม)' : ''}: ${dirLabel} — ${typeAndRoute}`;
          travelEvidenceQueue.push({ att, caption, isPdf: isPdfAttachment(att) });
        }
      }

      // Daily fuel receipt attachment: if this day has any "Personal
      // Vehicle" (CAR) segment, queue the Gasohol 91 price + the event
      // admin's uploaded receipt image for that specific date (with the
      // same closest-previous-date fallback used for the amount calc).
      const hasCarSegment = segmentsWithDir.some(({seg}) => {
        const typeCfg = SEGMENT_TYPES.find(t=>t.value===seg.type);
        return typeCfg && typeCfg.kind==='car';
      });
      if(hasCarSegment){
        const fuelEntry = getFuelPriceEntryForDate(day.date);
        if(fuelEntry){
          const fallbackNote = fuelEntry.date !== day.date ? ` (อ้างอิงราคาวันที่ ${fuelEntry.date} เนื่องจากไม่มีราคาของวันนี้)` : '';
          const caption = `⛽ ใบเสร็จราคาน้ำมันแก๊สโซฮอล์ 91 วันที่ ${formatThaiDate(day.date)}: ${Number(fuelEntry.price||0).toFixed(2)} บาท/ลิตร${fallbackNote}`;
          if(fuelEntry.receiptImage && fuelEntry.receiptImage.base64){
            fuelEvidenceQueue.push({ att: fuelEntry.receiptImage, caption, isPdf: false });
          } else if(fuelEntry.receiptUrl){
            // A receipt WAS uploaded by the event admin (receiptUrl is set)
            // but the Base64 fetch for it failed or never completed — this
            // is different from "nobody ever attached one" and worth
            // surfacing distinctly so it's obvious this needs checking in
            // Drive rather than just re-uploading a receipt that already
            // exists.
            fuelEvidenceQueue.push({ att: null, caption: caption + ' (⚠️ มีใบเสร็จแนบไว้ในระบบ แต่ดึงรูปมาแสดงไม่สำเร็จ กรุณาตรวจสอบไฟล์ใน Drive หรือแนบใบเสร็จใหม่อีกครั้งในหน้าแก้ไข Event)' });
          } else {
            fuelEvidenceQueue.push({ att: null, caption: caption + ' (ไม่มีใบเสร็จแนบในระบบ)' });
          }
        }
      }
    }

    await placeCapturedBlock(document.getElementById('pFooterBlock'), 0.92);

    // ===== Evidence section — strictly AFTER the Grand Total bar, and
    // ALWAYS starting on a brand new page (mandatory page-break-before),
    // regardless of how much room is left on the current page. Document
    // order from here: (1) travel evidence — images and scaled PDF pages,
    // in original day/segment order, each with its caption directly above
    // it — then (2) a distinct final sub-section for admin-uploaded fuel
    // price evidence. =====
    if(travelEvidenceQueue.length > 0 || fuelEvidenceQueue.length > 0){
      doc.addPage();
      cursorY = margin;
      forceNewPage = false;

      if(travelEvidenceQueue.length > 0){
        const titleCanvas = await captureSectionTitle('📎 หลักฐานประกอบการเบิกจ่าย (ใบเสร็จ/รูปถ่าย)');
        placeImage(titleCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', (titleCanvas.height * contentWidth) / titleCanvas.width);

        for(const item of travelEvidenceQueue){
          await placeEvidenceItem(item);
        }
      }

      if(fuelEvidenceQueue.length > 0){
        const fuelTitleCanvas = await captureSectionTitle('⛽ หลักฐานราคาน้ำมัน (แนบโดยผู้ดูแลกิจกรรม)');
        placeImage(fuelTitleCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', (fuelTitleCanvas.height * contentWidth) / fuelTitleCanvas.width);

        for(const item of fuelEvidenceQueue){
          await placeEvidenceItem(item);
        }
      }
    }
  } finally {
    el.style.position = prevPosition;
    el.style.left = prevLeft;
    el.style.zIndex = prevZ;
  }

  return doc;
}

// Converts a base64 data URI (e.g. "data:application/pdf;base64,....")
// into raw bytes, for handing to pdf.js.
function dataUriToUint8Array(dataUri){
  const base64 = (dataUri.split(',')[1] || dataUri);
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Small inline toast shown right next to the submit/download buttons.
// Unlike showMsg(), this never scrolls the page — it appears in place so a
// large-file notice doesn't interrupt/jump the UI while a submission is in
// progress. Auto-dismisses after a few seconds.
let _fileSizeToastTimer = null;
function showFileSizeToast(text){
  const el = document.getElementById('fileSizeToast');
  if(!el) return;
  el.textContent = text;
  el.classList.add('show');
  // Force reflow so the opacity transition actually plays.
  void el.offsetWidth;
  el.classList.add('visible');
  if(_fileSizeToastTimer) clearTimeout(_fileSizeToastTimer);
  _fileSizeToastTimer = setTimeout(()=>{
    el.classList.remove('visible');
    setTimeout(()=>{ el.classList.remove('show'); }, 250);
  }, 6000);
}

function checkPdfSize(doc){
  const sizeKB = Math.round(doc.output('blob').size / 1024);
  if(sizeKB > 400){
    const compressed = true;
    const tip = compressed
      ? 'ติ๊กบีบอัดไว้แล้วแต่ไฟล์ยังใหญ่ — ลองลดจำนวนรูปที่แนบต่อรายการ'
      : 'ถ้าต้องการไฟล์เล็กลง ลองติ๊ก "บีบอัดรูปหลักฐาน" ด้านบนแล้วสร้างใหม่อีกครั้ง';
    showFileSizeToast(`ไฟล์ PDF มีขนาด ${sizeKB} KB — ${compressed ? 'บีบอัดรูปแล้ว' : 'ยังไม่ได้บีบอัดรูป (คุณภาพต้นฉบับเต็ม)'} ไม่ใช่ข้อผิดพลาด แต่ ${tip}`);
  }
}



/* ---------- WORD (.docx) EXPORT ----------
   Built from the same state.days data as the PDF, so amounts and wording
   always match. Tables and text stay editable in Word (not images).
   Library: docx 8.5.0 (window.docx). */
function docxSegTypeLabel(seg){
  const typeCfg = SEGMENT_TYPES.find(t=>t.value===seg.type) || { label: '-' };
  return (seg.type==='OTHER' && seg.otherDescription) ? `อื่นๆ (${seg.otherDescription})` : typeCfg.label;
}

function docxSegDetail(seg, dateStr){
  const typeCfg = SEGMENT_TYPES.find(t=>t.value===seg.type) || {};
  const tollEmpty = seg.type==='TOLL' && !seg.origin && !seg.destination;
  if(seg.type==='PARKING' || tollEmpty || typeCfg.kind==='none') return '-';
  if(typeCfg.kind==='car'){
    const distance = Number(seg.distanceKm||0).toFixed(2);
    const price = getFuelPriceForDate(dateStr).toFixed(2);
    const amount = (Number(seg.amount)||0).toFixed(2);
    return `จาก ${seg.origin||'-'} - ไป ${seg.destination||'-'} ${distance}/15x${price} = ${amount} บาท`;
  }
  return `${seg.origin||'-'} → ${seg.destination||'-'}`;
}

// Same evidence order as the PDF: travel receipts (day by day), then the
// admin's fuel-price receipts for days that have a personal-car segment.
function collectEvidenceItems(){
  const travel = [], fuel = [];
  state.days.forEach(day=>{
    const segs = [
      ...day.outboundSegments.map(seg=>({ seg, dir: 'ขาไป' })),
      ...day.returnSegments.map(seg=>({ seg, dir: 'ขากลับ' }))
    ];
    segs.forEach(({ seg, dir })=>{
      const typeCfg = SEGMENT_TYPES.find(t=>t.value===seg.type) || {};
      let route;
      if(typeCfg.kind==='car'){
        route = docxSegDetail(seg, day.date);
      } else {
        const tollEmpty = seg.type==='TOLL' && !seg.origin && !seg.destination;
        const suffix = (seg.type==='PARKING' || tollEmpty) ? '' : ` (${seg.origin||'-'} → ${seg.destination||'-'})`;
        route = docxSegTypeLabel(seg) + suffix;
      }
      (seg.attachments||[]).forEach(att=>{
        travel.push({ att, caption: `หลักฐาน${att.isExisting ? ' (ไฟล์เดิม)' : ''}: ${dir} — ${route}` });
      });
    });
    const hasCar = segs.some(({seg})=>{ const c = SEGMENT_TYPES.find(t=>t.value===seg.type); return c && c.kind==='car'; });
    if(hasCar){
      const fe = getFuelPriceEntryForDate(day.date);
      if(fe){
        const note = fe.date !== day.date ? ` (อ้างอิงราคาวันที่ ${fe.date})` : '';
        const caption = `ใบเสร็จราคาน้ำมันแก๊สโซฮอล์ 91 วันที่ ${formatThaiDate(day.date)}: ${Number(fe.price||0).toFixed(2)} บาท/ลิตร${note}`;
        if(fe.receiptImage && fe.receiptImage.base64) fuel.push({ att: fe.receiptImage, caption });
        else fuel.push({ att: null, caption: caption + (fe.receiptUrl ? ' (ดึงรูปใบเสร็จไม่สำเร็จ)' : ' (ไม่มีใบเสร็จแนบในระบบ)') });
      }
    }
  });
  return travel.concat(fuel);
}

// Re-encodes any browser-decodable image as JPEG, max 1400px on the long
// side (keeps the .docx small). Returns null if the browser can't decode it
// (e.g. HEIC), so the caller can write a note instead of failing.
// Uses the attached photo as-is when it is already a JPEG/PNG of sensible size
// (re-encoding would only lose detail). Only very large or unusual images are
// redrawn — at high quality. Returns null if the browser can't decode it (e.g.
// HEIC), so the caller can write a note instead of failing.
function shrinkImageForDocx(dataUrl){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX = 2000;
      let w = img.naturalWidth || 800, h = img.naturalHeight || 600;
      if(/^data:image\/(jpeg|png)/.test(dataUrl) && w <= MAX && h <= MAX){ resolve({ dataUrl, width: w, height: h }); return; }
      if(w > MAX || h > MAX){ const k = MAX / Math.max(w, h); w = Math.round(w*k); h = Math.round(h*k); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve({ dataUrl: c.toDataURL('image/jpeg', 0.92), width: w, height: h });
    };
    img.onerror = ()=>resolve(null);
    img.src = dataUrl;
  });
}

async function pdfAttachmentToImages(att){
  const pdf = await pdfjsLib.getDocument({ data: dataUriToUint8Array(att.base64) }).promise;
  const out = [];
  for(let n = 1; n <= pdf.numPages; n++){
    const page = await pdf.getPage(n);
    const viewport = page.getViewport({ scale: 2 });
    const c = document.createElement('canvas');
    c.width = viewport.width; c.height = viewport.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport }).promise;
    out.push({ dataUrl: c.toDataURL('image/jpeg', 0.92), width: c.width, height: c.height });
  }
  return out;
}

async function buildDocxBlob(){
  if(!window.docx) throw new Error('โหลดไลบรารีสร้างไฟล์ Word ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต แล้วรีเฟรชหน้า)');
  if(submissionImagesLoadPromise) await submissionImagesLoadPromise;
  await ensureFuelReceiptImagesLoaded();
  const D = window.docx;
  const FONT = 'TH Sarabun New';
  // Font sizes are in half-points (24 = 12 pt). Body text and tables are 12 pt;
  // headings are a little larger so the sections stay easy to scan.
  const SZ = { body: 24, title: 32, heading: 28, sub: 24, total: 28 };
  const run = (text, o = {}) => new D.TextRun({ text: String(text == null ? '' : text), font: FONT, size: o.size || SZ.body, bold: !!o.bold, color: o.color });
  const para = (text, o = {}) => new D.Paragraph({ alignment: o.align, spacing: { after: o.after == null ? 80 : o.after }, children: [run(text, o)] });
  // Column widths in DXA (1/20 pt). A4 width 11906 minus 2 x 1000 margins
  // = 9906 usable; percentages are ignored by some Word/LibreOffice versions.
  const COLS = [600, 2300, 5106, 1900];
  const dxa = pct => Math.round(9906 * pct / 100);
  const cell = (text, w, o = {}) => new D.TableCell({
    width: { size: dxa(w), type: D.WidthType.DXA },
    columnSpan: o.span,
    shading: o.shade ? { fill: o.shade, type: D.ShadingType.CLEAR, color: 'auto' } : undefined,
    children: [para(text, { size: SZ.body, bold: o.bold, after: 0, align: o.right ? D.AlignmentType.RIGHT : undefined })]
  });

  const total = updateTotals();
  const empName = document.getElementById('employeeName').value.trim() || '-';
  const dept = document.getElementById('department').value.trim() || '-';
  const children = [
    para('เอกสารค่าเดินทาง', { bold: true, size: SZ.title }),
    para(eventName || ''),
    para('วันที่ออกเอกสาร: ' + formatThaiDate(localISODate(new Date())), { size: SZ.body }),
    para('ผู้เบิก: ' + empName + '     แผนก/ฝ่าย: ' + dept, { after: 200 })
  ];

  state.days.forEach((day, di)=>{
    const dateLabel = formatThaiDate(day.date);
    const dayLabel = state.days.length > 1 ? `วันที่ ${di+1}${dateLabel ? ' — ' + dateLabel : ''}` : (dateLabel || 'รายละเอียดการเดินทาง');
    children.push(para(dayLabel, { bold: true, size: SZ.heading, after: 120 }));
    [['ขาไป', day.outboundSegments], ['ขากลับ', day.returnSegments]].forEach(([label, segs])=>{
      let sub = 0;
      const rows = [ new D.TableRow({ tableHeader: true, children: [
        cell('#', 6, { bold: true, shade: 'EEF2EC' }), cell('ประเภท', 23, { bold: true, shade: 'EEF2EC' }),
        cell('รายละเอียด', 52, { bold: true, shade: 'EEF2EC' }), cell('จำนวนเงิน', 20, { bold: true, shade: 'EEF2EC', right: true }) ] }) ];
      segs.forEach((seg, i)=>{
        sub += Number(seg.amount) || 0;
        rows.push(new D.TableRow({ children: [
          cell(String(i+1), 6), cell(docxSegTypeLabel(seg), 23), cell(docxSegDetail(seg, day.date), 52),
          cell((Number(seg.amount)||0).toFixed(2), 20, { right: true }) ] }));
      });
      rows.push(new D.TableRow({ children: [ cell('ยอดรวม ' + label, 80, { bold: true, span: 3, shade: 'FAFAFA' }), cell(sub.toFixed(2), 20, { bold: true, right: true, shade: 'FAFAFA' }) ] }));
      children.push(para(label, { bold: true, size: SZ.sub, after: 40 }));
      children.push(new D.Table({ width: { size: 9906, type: D.WidthType.DXA }, columnWidths: COLS, layout: D.TableLayoutType.FIXED, rows }));
      children.push(para('', { after: 120 }));
    });
  });
  children.push(para('ยอดรวมทั้งสิ้น ' + fmt(total) + ' บาท', { bold: true, size: SZ.total, after: 240 }));

  const items = collectEvidenceItems();
  if(items.length){
    children.push(new D.Paragraph({ pageBreakBefore: true, spacing: { after: 160 }, children: [run('หลักฐานประกอบการเบิกจ่าย', { bold: true, size: SZ.heading })] }));
    for(const it of items){
      children.push(para(it.caption, { size: SZ.body, after: 60 }));
      if(!it.att || !it.att.base64) continue;
      let imgs = [];
      const isPdf = isPdfAttachment(it.att);
      try{
        imgs = isPdf ? await pdfAttachmentToImages(it.att) : [await shrinkImageForDocx(it.att.base64)];
      }catch(err){ imgs = []; }
      imgs = imgs.filter(Boolean);
      if(!imgs.length){ children.push(para('(แสดงไฟล์นี้ในเอกสารไม่ได้ — โปรดแนบเป็น JPG/PNG/PDF)', { size: SZ.body, color: 'C0392B' })); continue; }
      for(const im of imgs){
        const maxW = isPdf ? 620 : 500, maxH = 820; // photos ~3/4 of the page width
        let w = maxW, h = Math.round(im.height * maxW / im.width);
        if(h > maxH){ h = maxH; w = Math.round(im.width * maxH / im.height); }
        children.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing: { after: 200 },
          children: [ new D.ImageRun({ data: dataUriToUint8Array(im.dataUrl), transformation: { width: w, height: h } }) ] }));
      }
    }
  }

  const doc = new D.Document({
    styles: { default: { document: { run: { font: FONT, size: SZ.body } } } },
    sections: [{ properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1000, bottom: 1000, left: 1000, right: 1000 } } }, children }]
  });
  return D.Packer.toBlob(doc);
}

  if(isNaN(dt)) return isoLocal;
  return dt.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric' }) + (t ? ' ' + t : '');
}

function confirmModal(opts){
  return new Promise(resolve=>{
    const root = document.getElementById('modalRoot');
    const okCls = opts.danger ? 'btn btn-danger' : 'btn btn-primary';
    const btns = opts.stacked
      ? `<button type="button" class="${okCls} btn-block" data-r="1">${opts.ok}</button><button type="button" class="btn btn-outline btn-block" data-r="0">${opts.cancel}</button>`
      : `<button type="button" class="btn btn-ghost" data-r="0">${opts.cancel}</button><button type="button" class="${okCls}" data-r="1">${opts.ok}</button>`;
    root.innerHTML = `<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h2 id="mTitle">${opts.title}</h2><div class="modal-body">${opts.html || ''}</div>
      <div class="modal-actions ${opts.stacked ? 'stacked' : ''}">${btns}</div></div></div>`;
    const done = v => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if(e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    root.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => done(b.dataset.r === '1')));
    const first = root.querySelector('[data-r="1"]'); if(first) first.focus();
  });
}
