function draftKey(){ return 'eetDraft:' + EVENT_ID; }
function readDraft(){
  try{ const d = JSON.parse(localStorage.getItem(draftKey()) || 'null'); return (d && d.v === 1 && d.name) ? d : null; }
  catch(e){ return null; }
}
function clearDraft(){ try{ localStorage.removeItem(draftKey()); }catch(e){} setDraftStatus(''); }
function setDraftStatus(text){ const el = document.getElementById('draftStatus'); if(el) el.textContent = text; }
function scheduleDraftSave(){
  if(!ui.unlocked || ui.sending) return;
  clearTimeout(ui.draftTimer);
  ui.draftTimer = setTimeout(saveDraft, 800);
}
function draftDays(keepNewFiles){
  // Existing receipts are re-fetched from Drive, so only their URL is kept.
  return JSON.parse(JSON.stringify(state.days, (k, v) => v)).map(day => {
    ['outboundSegments','returnSegments'].forEach(key => {
      day[key].forEach(seg => {
        seg.attachments = (seg.attachments || []).filter(a => keepNewFiles || a.isExisting).map(a =>
          a.isExisting ? { isExisting:true, existingUrl:a.existingUrl, fileName:a.fileName, mimeType:a.mimeType } : a);
      });
    });
    return day;
  });
}
function formSnapshot(){
  return JSON.stringify([document.getElementById('employeeName').value.trim(), document.getElementById('department').value.trim(), state.days]);
}
function saveDraft(){
  const name = document.getElementById('employeeName').value.trim();
  if(!name || !ui.unlocked) return;
  // Nothing changed since the last successful submit → no draft to keep.
  if(ui.submittedSnap && ui.submittedSnap === formSnapshot()){ clearDraft(); return; }
  const base = { v:1, name, dept: document.getElementById('department').value.trim(), savedAt: Date.now() };
  try{
    localStorage.setItem(draftKey(), JSON.stringify(Object.assign({}, base, { days: draftDays(true) })));
    setDraftStatus('บันทึกร่างในเครื่องนี้แล้ว ' + nowHHMM());
  }catch(e){
    try{
      localStorage.setItem(draftKey(), JSON.stringify(Object.assign({}, base, { days: draftDays(false), filesDropped: true })));
      setDraftStatus('บันทึกร่างแล้ว ' + nowHHMM() + ' (ไฟล์แนบใหม่ใหญ่เกินจะเก็บในร่าง)');
    }catch(e2){ setDraftStatus(''); }
  }
}
function showDraftBanner(d){
  const when = new Date(d.savedAt);
  const stamp = when.toLocaleDateString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' ' + String(when.getHours()).padStart(2,'0') + ':' + String(when.getMinutes()).padStart(2,'0');
  const total = (d.days || []).reduce((s, day) => s + [...day.outboundSegments, ...day.returnSegments].reduce((a, sg) => a + (parseFloat(sg.amount) || 0), 0), 0);
  document.getElementById('pageBanner').innerHTML = bannerHtml('info',

    `<button type="button" class="btn btn-primary" onclick="resumeDraft()">กรอกต่อจากเดิม</button><button type="button" class="btn btn-outline" onclick="discardDraft()">เริ่มใหม่</button>`);
}
function resumeDraft(){
  const d = readDraft(); if(!d) return;
  document.getElementById('pageBanner').innerHTML = '';

  document.getElementById('department').value = d.dept || '';

  if(hasExisting) submissionImagesLoadPromise = loadSubmissionAttachmentImages(d.name);

async function discardDraft(){
  const ok = await confirmModal({ title:'เริ่มใหม่และทิ้งร่างนี้?', html:'ข้อมูลที่กรอกไว้ในร่างจะหายและกู้คืนไม่ได้', ok:'ทิ้งร่าง', cancel:'กลับไปใช้ร่าง', danger:true });

/* ---------- searchable dropdown (names + stations) ---------- */
const combo = { input:null, items:[], active:-1, source:null, onPick:null, emptyText:null, typed:false, onHover:null };
function comboOpen(input, source, onPick, emptyText, onHover){
  Object.assign(combo, { input, source, onPick, emptyText, typed:false, onHover: onHover || null });
  comboRefresh();
}
function comboRefresh(){
  if(!combo.input) return drawCombo();
  combo.items = combo.source(combo.typed ? combo.input.value : '');
  combo.active = combo.items.length ? 0 : -1;
  drawCombo();
}
function highlight(label, q){
  const s = esc(label); q = (q || '').trim();
  if(!q) return s;
  const i = label.indexOf(q);
  return i < 0 ? s : esc(label.slice(0, i)) + '<b>' + esc(q) + '</b>' + esc(label.slice(i + q.length));
}
function comboBoxEl(){
  let box = document.getElementById('comboBox');
  if(!box){
    box = document.createElement('ul');
    box.id = 'comboBox'; box.className = 'combo-box'; box.setAttribute('role', 'listbox');
    // Keep focus in the input when an option is clicked — but only for the
    // options themselves, so the list's own scrollbar can still be dragged.
    box.addEventListener('mousedown', e => { if(e.target.closest('li')) e.preventDefault(); });
    document.body.appendChild(box);
  }
  return box;
}
// Moves the open list under its input without touching the list contents or
// its scroll position (called on page scroll / resize).
function positionCombo(){
  const box = comboBoxEl();
  if(!combo.input){ box.style.display = 'none'; return; }
  const r = combo.input.getBoundingClientRect();
  Object.assign(box.style, { display:'block', left:(r.left + window.scrollX) + 'px', top:(r.bottom + window.scrollY + 6) + 'px', width: Math.max(r.width, 240) + 'px' });
}
function drawCombo(keepActiveInView){
  const box = comboBoxEl();
  positionCombo();
  if(!combo.input) return;
  const q = combo.typed ? combo.input.value : '';
  if(!combo.items.length){
    box.innerHTML = `<li class="combo-empty">${combo.emptyText ? combo.emptyText(combo.input.value) : 'ไม่พบรายการ'}</li>`;
    return;
  }
  box.innerHTML = combo.items.map((it, i) =>
    `<li role="option" aria-selected="${i===combo.active}" class="${i===combo.active ? 'active' : ''}" onclick="comboPick(${i})" onmouseenter="comboHover(${i})">
      <span>${highlight(it.label, q)}</span><span class="combo-sub">${esc(it.sub || '')}${it.tag ? `<span class="combo-tag">${esc(it.tag)}</span>` : ''}</span></li>`).join('');
  if(keepActiveInView){ const act = box.querySelector('.active'); if(act) act.scrollIntoView({ block:'nearest' }); }
  else box.scrollTop = 0;
}
function comboHover(i){ const it = combo.items[i]; if(it && combo.onHover) combo.onHover(it.value); }
function comboKey(e){
  if(!combo.input) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); combo.active = Math.min(combo.items.length - 1, combo.active + 1); drawCombo(true); comboHover(combo.active); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); combo.active = Math.max(0, combo.active - 1); drawCombo(true); comboHover(combo.active); }
  else if(e.key === 'Enter'){ if(combo.active >= 0){ e.preventDefault(); comboPick(combo.active); } }
  else if(e.key === 'Escape'){ comboClose(); }
}
function comboPick(i){
  const it = combo.items[i], cb = combo.onPick, inp = combo.input;
  comboClose();
  if(it && cb) cb(it.value, inp);
}
function comboClose(){ combo.input = null; drawCombo(); }
window.addEventListener('resize', () => { if(combo.input) positionCombo(); });
window.addEventListener('scroll', e => {
  if(!combo.input) return;
  if(e.target && e.target.id === 'comboBox') return; // the list scrolling itself
  positionCombo();
}, true);

/* ---------- section 1: who is claiming ---------- */
function nameSource(q){
  q = (q || '').trim();
  return employeeList.filter(e => !q || String(e.name).includes(q)).slice(0, 60)
    .map(e => ({ value:e.name, label:e.name, sub:e.department || '', tag: e.submitted ? 'ส่งแล้ว' : '' }));
}
const mySubPrefetch = {};
function prefetchMySub(name){
  const hit = mySubPrefetch[name];
  if(hit && Date.now() - hit.at < 30000) return hit.p;
  const p = callApi('getMySubmission', { eventId: EVENT_ID, employeeName: name }).catch(() => null);
  mySubPrefetch[name] = { at: Date.now(), p };
  return p;
}
function nameFocus(input){
  comboOpen(input, nameSource, v => selectEmployee(v),
    v => `ไม่พบ “${esc(v)}” ในรายชื่อกิจกรรมนี้<br>ตรวจตัวสะกด หรือติดต่อผู้จัดงานให้เพิ่มชื่อ`,
    v => prefetchMySub(v));
}
function nameInput(input){ combo.typed = true; comboRefresh(); setNameError(''); }
function nameBlur(input){
  setTimeout(() => {
    if(combo.input === input) comboClose();
    const v = input.value.trim();
    if(!v){ return; }
    if(v === lastLoadedEmployeeName) return;
    const match = employeeList.find(e => e.name === v);
    if(match) selectEmployee(v);
    else setNameError('ไม่พบชื่อนี้ในรายชื่อของกิจกรรม — เลือกจากรายการ หรือติดต่อผู้จัดงานให้เพิ่มชื่อ');
  }, 150);
}
function setNameError(text){
  const el = document.getElementById('nameError');
  const inp = document.getElementById('employeeName');
  if(el){ el.textContent = text; el.style.display = text ? 'block' : 'none'; }
  if(inp) inp.classList.toggle('invalid', !!text);
}
function resetFormForNewEmployee(){
  document.getElementById('department').value = '';
  state.days = [ newDay() ];
  submissionImagesLoadPromise = null;
  ui.errorSegs.clear();
  document.getElementById('msgArea').innerHTML = '';
  document.getElementById('validationBox').innerHTML = '';
}
async function selectEmployee(name){
  const nameEl = document.getElementById('employeeName');
  if(name === lastLoadedEmployeeName && ui.unlocked){ nameEl.value = name; return; }
  if(ui.unlocked && formHasData() && lastLoadedEmployeeName && name !== lastLoadedEmployeeName){
    const ok = await confirmModal({ title:'เปลี่ยนชื่อผู้เบิก?', html:'รายการเดินทางที่กรอกไว้จะถูกล้าง เพื่อเริ่มใบเบิกของคนใหม่', ok:'เปลี่ยนชื่อ', cancel:'ยกเลิก', danger:true });
    if(!ok){ nameEl.value = lastLoadedEmployeeName; return; }
  }
  document.getElementById('pageBanner').innerHTML = '';
  lastLoadedEmployeeName = name;
  resetFormForNewEmployee();
  nameEl.value = name;
  setNameError('');
  const match = employeeList.find(e => e.name === name);
  document.getElementById('department').value = (match && match.department) || '';

  setEmployeeLoadStatus('กำลังตรวจสอบใบเบิกเดิม…');
  let res = null;
  try{ res = await prefetchMySub(name); }catch(e){ res = null; }
  delete mySubPrefetch[name]; // use a prefetched answer once; next pick asks again
  setEmployeeLoadStatus(null);
  if(name !== lastLoadedEmployeeName) return; // switched again meanwhile

  if(res && res.ok && res.exists){
    const ok = await confirmModal({
      title:'พบใบเบิกที่เคยส่งไว้', stacked:true,
      html:`<p><b>${esc(name)}</b> ส่งใบเบิกไว้แล้วเมื่อ ${esc(res.data.updatedAt || '-')} ยอด ${fmt(res.data.totalAmount)} บาท</p><p class="muted">ถ้าแก้ไขแล้วส่งใหม่ ระบบจะเก็บฉบับเดิมไว้เป็นประวัติ</p>`,
      ok:'ใช่ ฉันเอง — เปิดใบเบิกเดิมมาแก้ไข', cancel:'ไม่ใช่ฉัน — เลือกชื่อใหม่'
    });
    if(!ok){
      lastLoadedEmployeeName = ''; nameEl.value = ''; document.getElementById('department').value = '';
      ui.unlocked = false; applyLock(); render(); nameEl.focus();
      return;
    }
    document.getElementById('department').value = res.data.department || document.getElementById('department').value;
    state.days = (res.data.trips && res.data.trips.length) ? tripsArrayToDays(res.data.trips) : [ newDay() ];
    submissionImagesLoadPromise = loadSubmissionAttachmentImages(name);
  }
  ui.unlocked = true; applyLock(); render(); scheduleDraftSave();
}
function onEmployeeChange(){ /* kept for compatibility; selection now goes through selectEmployee() */ }

/* ---------- section 2: trips ---------- */
function addDay(){ state.days.push(newDay()); render(); }
function removeDay(di){
  if(state.days.length <= 1) return;
  const day = state.days[di];
  state.days.splice(di, 1); render();
  showUndo(`ลบ “วันที่ ${di+1}” แล้ว`, () => { state.days.splice(di, 0, day); render(); });
}
function addSegment(di, key){ state.days[di][key].push(newSegment()); render(); }
function removeSegment(di, key, si){
  const seg = state.days[di][key][si];
  state.days[di][key].splice(si, 1);
  ui.openTypeMenu = null; render();
  const label = seg.type ? typeLabel(seg.type) : '';
  const amt = parseFloat(seg.amount) > 0 ? ' ' + fmt(seg.amount) + ' บาท' : '';
  showUndo(`ลบ “ต่อที่ ${si+1}${label ? ' · ' + label : ''}${amt}” แล้ว`, () => { state.days[di][key].splice(si, 0, seg); render(); });
}
function typeLabel(v){ const t = SEGMENT_TYPES.find(x => x.value === v); return t ? t.label : ''; }

function toggleTypeMenu(id){
  ui.openTypeMenu = ui.openTypeMenu === id ? null : id;
  render();
  if(ui.openTypeMenu){ const s = document.getElementById('tm-search-' + id); if(s) s.focus(); }
}
function filterTypeMenu(id, q){
  q = (q || '').trim();
  const menu = document.getElementById('tm-' + id); if(!menu) return;
  menu.querySelectorAll('[data-label]').forEach(li => { li.style.display = li.dataset.label.includes(q) ? '' : 'none'; });
  menu.querySelectorAll('.tm-group').forEach(g => {
    const any = Array.from(g.querySelectorAll('[data-label]')).some(li => li.style.display !== 'none');
    g.style.display = any ? '' : 'none';
  });
}
function typeMenuKey(e, id){
  if(e.key === 'Escape'){ toggleTypeMenu(id); return; }
  if(e.key === 'Enter'){
    const first = Array.from(document.querySelectorAll(`#tm-${id} [data-label]`)).find(li => li.style.display !== 'none');
    if(first){ e.preventDefault(); first.click(); }
  }
}
function pickType(di, key, si, v){ ui.openTypeMenu = null; segUpdate(di, key, si, 'type', v); }
document.addEventListener('mousedown', e => {
  if(ui.openTypeMenu && !e.target.closest('.type-picker')){ ui.openTypeMenu = null; render(); }
}, true);

function typeMenuHtml(id, di, key, si, current){
  const group = gi => {
    const g = TYPE_GROUPS[gi];
    return `<div class="tm-group"><div class="tm-head">${g.label}</div>` + g.values.map(v => {
      const on = v === current;
      return `<button type="button" role="option" aria-selected="${on}" class="tm-opt${on ? ' active' : ''}" data-label="${esc(typeLabel(v))}" onclick="pickType(${di},'${key}',${si},'${v}')"><span>${esc(typeLabel(v))}</span>${on ? '<span aria-hidden="true">✓</span>' : ''}</button>`;
    }).join('') + '</div>';
  };
  return `<div class="type-menu" id="tm-${id}" role="listbox" aria-label="วิธีการเดินทาง">
    <div class="tm-search">${ICON.search}<input id="tm-search-${id}" aria-label="ค้นหาวิธีการเดินทาง" placeholder="พิมพ์เพื่อค้นหา" oninput="filterTypeMenu('${id}', this.value)" onkeydown="typeMenuKey(event,'${id}')"></div>
    <div class="tm-cols"><div>${group(0)}${group(3)}</div><div>${group(1)}${group(2)}</div></div></div>`;
}

function stationFocus(input, di, key, si, field){
  const seg = state.days[di][key][si];
  comboOpen(input, q => getSelectableStations(seg.type).filter(s => !q || s.includes(q.trim())).map(s => ({ value:s, label:s })),
    v => { input.value = v; segFieldInput(di, key, si, field, v); scheduleDraftSave(); },
    v => `ไม่พบ “${esc(v)}” ใน${esc(typeLabel(seg.type))}<br>ลองพิมพ์คำอื่น หรือเปลี่ยนวิธีการเดินทาง`);
}
function stationInput(input, di, key, si, field){ combo.typed = true; comboRefresh(); segFieldInput(di, key, si, field, input.value); }
function stationBlur(input){ setTimeout(() => { if(combo.input === input) comboClose(); }, 150); }

function fld(label, inner, opts = {}){
  return `<div class="fld${opts.cls ? ' ' + opts.cls : ''}"><label${opts.forId ? ` for="${opts.forId}"` : ''}>${label}${opts.req ? ' <span class="req">*</span>' : ''}</label>${inner}${opts.after || ''}</div>`;
}
function amountInput(di, key, si, seg){
  const id = `amtinput-${di}-${key}-${si}`;
  return `<div class="fld amt-fld"><label for="${id}">จำนวนเงิน <span class="req">*</span></label><div class="suffix-wrap">
    <input type="number" step="0.01" min="0" placeholder="0.00" id="${id}" value="${seg.amount > 0 ? Number(seg.amount).toFixed(2) : ''}"
      oninput="segAmountInput(${di},'${key}',${si},this.value)" onblur="this.value = this.value ? parseFloat(this.value).toFixed(2) : '';"><span class="suffix">บาท</span></div></div>`;
}
function routeRow(di, key, si, seg, opts){
  const id = segId(di, key, si);
  const kmFld = opts.km ? fld('ระยะทาง', `<div class="suffix-wrap"><input id="km-${id}" type="number" step="0.01" min="0" placeholder="0.00" value="${seg.distanceKm ? Number(seg.distanceKm).toFixed(2) : ''}"
        oninput="segFieldInput(${di},'${key}',${si},'distanceKm',this.value)" onblur="this.value = this.value ? parseFloat(this.value).toFixed(2) : ''; segFieldInput(${di},'${key}',${si},'distanceKm',this.value);"><span class="suffix">กม.</span></div>`, { req:true, forId:`km-${id}` }) : '';
  let o, d;
  if(opts.rail){
    const oBad = seg.origin && !isValidStation(seg.type, seg.origin), dBad = seg.destination && !isValidStation(seg.type, seg.destination);
    o = fld('สถานีต้นทาง', `<input id="st-o-${id}" autocomplete="off" value="${esc(seg.origin)}" placeholder="พิมพ์ชื่อสถานี" class="${oBad ? 'invalid' : ''}"
          onfocus="stationFocus(this,${di},'${key}',${si},'origin')" oninput="stationInput(this,${di},'${key}',${si},'origin')" onkeydown="comboKey(event)" onblur="stationBlur(this)">`,
          { req:true, forId:`st-o-${id}`, after:`<div class="fld-err" id="hint-o-${di}-${key}-${si}" style="display:${oBad ? 'block' : 'none'}">ไม่พบสถานีนี้ กรุณาเลือกจากรายการ</div>` });
    d = fld('สถานีปลายทาง', `<input id="st-d-${id}" autocomplete="off" value="${esc(seg.destination)}" placeholder="พิมพ์ชื่อสถานี" class="${dBad ? 'invalid' : ''}"
          onfocus="stationFocus(this,${di},'${key}',${si},'destination')" oninput="stationInput(this,${di},'${key}',${si},'destination')" onkeydown="comboKey(event)" onblur="stationBlur(this)">`,
          { req:true, forId:`st-d-${id}`, after:`<div class="fld-err" id="hint-d-${di}-${key}-${si}" style="display:${dBad ? 'block' : 'none'}">ไม่พบสถานีนี้ กรุณาเลือกจากรายการ</div>` });
  } else {
    const req = !opts.optional;
    const ph = opts.optional ? 'ไม่บังคับ' : (opts.phO || 'เช่น ออฟฟิศ');
    o = fld('จาก (ต้นทาง)', `<input id="o-${id}" value="${esc(seg.origin)}" placeholder="${ph}" oninput="segFieldInput(${di},'${key}',${si},'origin',this.value)">`, { req, forId:`o-${id}` });
    d = fld('ไป (ปลายทาง)', `<input id="d-${id}" value="${esc(seg.destination)}" placeholder="${opts.optional ? 'ไม่บังคับ' : 'เช่น สถานที่จัดงาน'}" oninput="segFieldInput(${di},'${key}',${si},'destination',this.value)">`, { req, forId:`d-${id}` });
  }
  return `<div class="route${opts.km ? ' has-km' : ''}">${o}<div class="route-arrow">${ICON.arrow}</div>${d}${kmFld}</div>`;
}

function renderSegment(di, key, seg, si, dayDate){
  const id = segId(di, key, si);
  const typeCfg = SEGMENT_TYPES.find(t => t.value === seg.type) || SEGMENT_TYPES[0];
  let body = '', note = '';
  if(typeCfg.kind === 'placeholder'){
    note = 'เลือกวิธีการเดินทางก่อน แล้วช่องที่ต้องกรอกจะขึ้นมา';
  } else if(typeCfg.kind === 'rail'){
    body = routeRow(di, key, si, seg, { rail:true });
    note = 'คำนวณจากสถานีอัตโนมัติ · แก้ได้';
  } else if(typeCfg.kind === 'car'){
    const fe = getFuelPriceEntryForDate(dayDate);
    const has = fe && Number(fe.price) > 0;
    if(!has) body += bannerHtml('warn', `ยังไม่มีราคาน้ำมันของวันที่ ${esc(formatThaiDate(dayDate) || 'นี้')} ในระบบ — ระบบคำนวณให้ไม่ได้ กรอกจำนวนเงินเองได้ หรือแจ้งผู้จัดงานให้เพิ่มราคา`);
    body += routeRow(di, key, si, seg, { km:true });
    note = has ? `คำนวณอัตโนมัติ: (ระยะทาง ÷ 15) × ${Number(fe.price).toFixed(2)} บาท/ลิตร${fe.date !== dayDate ? ` (ใช้ราคาล่าสุดของวันที่ ${esc(formatThaiDate(fe.date))})` : ''} · แก้ได้` : 'กรอกจำนวนเงินเองได้ระหว่างรอราคาน้ำมัน';
  } else if(seg.type === 'PARKING' || typeCfg.kind === 'none'){
    body = '';
  } else if(seg.type === 'TOLL'){
    body = routeRow(di, key, si, seg, { optional:true });
  } else {
    if(seg.type === 'OTHER'){
      body += fld('ระบุประเภทการเดินทาง', `<input id="oth-${id}" value="${esc(seg.otherDescription || '')}" placeholder="เช่น เรือข้ามฟาก, รถสองแถว" oninput="segFieldInput(${di},'${key}',${si},'otherDescription',this.value)">`, { req:true, forId:`oth-${id}` });
    }
    body += routeRow(di, key, si, seg, {});
  }

  const requiresReceipt = seg.type === 'PARKING' || seg.type === 'TOLL' || seg.type === 'GRAB' || typeCfg.kind === 'car';
  const attachLabel = seg.type === 'PARKING' ? 'ใบเสร็จค่าจอดรถ'
    : seg.type === 'TOLL' ? 'ใบเสร็จค่าทางด่วน'
    : seg.type === 'GRAB' ? 'หลักฐานการเดินทาง Grab/Lineman/Bolt'
    : typeCfg.kind === 'car' ? 'แคปหน้าจอ Google Maps'
    : 'หลักฐาน/สลิป (ถ้ามี)';
  const thumbs = (seg.attachments || []).map((a, ai) => {
    const rm = `<button type="button" class="thumb-rm" aria-label="ลบไฟล์นี้" onclick="removeAttachment(${di},'${key}',${si},${ai})">✕</button>`;
    const badge = a.isExisting ? '<span class="thumb-badge">เดิม</span>' : '';
    if(a.isExisting && !a.base64) return `<div class="thumb thumb-loading">${badge}<span>กำลังโหลดรูป…</span>${rm}</div>`;
    if(isPdfAttachment(a)) return `<div class="thumb thumb-pdf" title="${esc(a.fileName || '')}">${badge}<span class="thumb-pdf-icon">PDF</span><span class="thumb-name">${esc(a.fileName || 'ไฟล์ PDF')}</span>${rm}</div>`;
    return `<div class="thumb">${badge}<button type="button" class="thumb-view" aria-label="ดูรูปขนาดเต็ม" onclick="openImageLightbox('${a.base64}')"><img src="${a.base64}" alt=""></button>${rm}</div>`;
  }).join('');
  const attachHtml = (typeCfg.kind === 'none' || typeCfg.kind === 'placeholder') ? '' : `
    <div class="attach">
      <span class="attach-label">${attachLabel}${requiresReceipt ? ' <span class="req">*</span>' : ''}</span>
      <div class="attach-row">${thumbs}<label class="attach-add">${ICON.clip}<span>แนบไฟล์</span><input type="file" accept="image/*,application/pdf" multiple onchange="handleFiles(event, ${di}, '${key}', ${si})"></label></div>
    </div>`;

  const open = ui.openTypeMenu === id;
  const showAmount = typeCfg.kind !== 'none' && typeCfg.kind !== 'placeholder';
  return `
    <div class="seg${ui.errorSegs.has(id) ? ' has-error' : ''}" id="seg-${id}">
      <div class="seg-head">
        <span class="seg-no">ต่อที่ ${si+1}</span>
        <div class="type-picker">
          <button type="button" class="type-btn${open ? ' open' : ''}${typeCfg.kind === 'placeholder' ? ' empty' : ''}" aria-haspopup="listbox" aria-expanded="${open}" onclick="toggleTypeMenu('${id}')">
            <span>${esc(typeCfg.label)}</span>${ICON.chev}</button>
          ${open ? typeMenuHtml(id, di, key, si, seg.type) : ''}
        </div>
        <div class="grow"></div>
        ${showAmount ? amountInput(di, key, si, seg) : (typeCfg.kind === 'none' ? '<span class="muted small">ไม่เบิก (0.00 บาท)</span>' : '')}
        <button type="button" class="icon-btn danger" aria-label="ลบต่อที่ ${si+1}" onclick="removeSegment(${di},'${key}',${si})">${ICON.trash}</button>
      </div>
      ${(body || note || attachHtml) ? `<div class="seg-body">${body}${note ? `<p class="seg-note">${note}</p>` : ''}${attachHtml}</div>` : ''}
    </div>`;
}

function dirBlockHtml(di, key, label){
  const segs = state.days[di][key];
  const sub = segs.reduce((s, seg) => s + (parseFloat(seg.amount) || 0), 0);
  return `<div class="dir">
    <div class="dir-head"><h4>${label}</h4><span class="muted">รวม <b id="subtotal-${di}-${key}">${fmt(sub)} บาท</b></span></div>
    ${segs.map((seg, si) => renderSegment(di, key, seg, si, state.days[di].date)).join('')}
    <button type="button" class="btn-dashed" onclick="addSegment(${di},'${key}')">+ เพิ่มการเดินทางต่อที่ ${segs.length + 1} (${label})</button>
  </div>`;
}

function render(){
  const c = document.getElementById('tripsContainer');
  if(!c) return;
  c.innerHTML = state.days.map((day, di) => `
    <div class="day" id="day-${di}">
      <div class="day-head">
        <h3>วันที่ ${di+1}</h3>
        <label class="sr-only" for="date-${di}">วันที่เดินทาง วันที่ ${di+1}</label>
        <input type="date" id="date-${di}" value="${esc(day.date)}" max="${TODAY_ISO}" onchange="dayUpdate(${di},'date',this.value)">
        <div class="grow"></div>
        ${state.days.length > 1 ? `<button type="button" class="link-danger" onclick="removeDay(${di})">ลบวันนี้</button>` : ''}
      </div>
      ${dirBlockHtml(di, 'outboundSegments', 'ขาไป')}
      <div class="day-divider"></div>
      ${dirBlockHtml(di, 'returnSegments', 'ขากลับ')}
    </div>`).join('') +
    `<button type="button" class="btn btn-outline btn-block" onclick="addDay()">+ เพิ่มวันเดินทาง (กิจกรรมหลายวัน)</button>`;
  updateTotals();
}

function refreshTotals(){
  let grand = 0;
  state.days.forEach((day, di) => {
    ['outboundSegments','returnSegments'].forEach(key => {
      let subtotal = 0;
      day[key].forEach(seg => { subtotal += (parseFloat(seg.amount) || 0); });
      grand += subtotal;
      const subEl = document.getElementById(`subtotal-${di}-${key}`);
      if(subEl) subEl.textContent = fmt(subtotal) + ' บาท';
    });
  });
  const g = document.getElementById('grandTotal'); if(g) g.textContent = fmt(grand) + ' บาท';
  const sp = document.getElementById('summaryPreview'); if(sp) sp.value = buildSummaryText(grand);
  scheduleDraftSave();
  return grand;
}

/* ---------- section 3: review & send ---------- */
function copySummary(){
  const textarea = document.getElementById('summaryPreview');
  const btn = document.getElementById('copySummaryBtn');
  const hint = document.getElementById('copyHint');
  const done = () => {
    btn.innerHTML = '✓ คัดลอกแล้ว';
    hint.style.display = 'inline';
    setTimeout(() => { btn.innerHTML = ICON.copy + ' คัดลอกข้อความสรุป'; hint.style.display = 'none'; }, 2200);
  };
  const fallback = () => { textarea.select(); document.execCommand('copy'); window.getSelection().removeAllRanges(); textarea.blur(); done(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(textarea.value).then(done).catch(fallback);
  else fallback();
}

function validate(){
  const errors = [];
  ui.errorSegs.clear();
  const add = (text, target, segKey) => { errors.push({ text, target }); if(segKey) ui.errorSegs.add(segKey); };
  if(!document.getElementById('employeeName').value.trim()) add('ข้อมูลผู้เบิก: กรุณาเลือกชื่อผู้เบิก', 'sec1');
  if(!document.getElementById('department').value.trim()) add('ข้อมูลผู้เบิก: กรุณากรอกแผนก/ฝ่าย', 'sec1');

  state.days.forEach((day, di) => {
    if(!day.date) add(`วันที่ ${di+1}: กรุณาเลือกวันที่เดินทาง`, `day-${di}`);
    else if(day.date > TODAY_ISO) add(`วันที่ ${di+1}: ไม่สามารถเลือกวันที่ในอนาคตได้`, `day-${di}`);
    [['outboundSegments','ขาไป'],['returnSegments','ขากลับ']].forEach(([key, label]) => {
      const segments = day[key];
      if(segments.length === 0) add(`วันที่ ${di+1} · ${label}: ต้องมีอย่างน้อย 1 ต่อการเดินทาง`, `day-${di}`);
      segments.forEach((seg, si) => {
        const sid = segId(di, key, si);
        const typeCfg = SEGMENT_TYPES.find(t => t.value === seg.type) || SEGMENT_TYPES[0];
        const tag = `วันที่ ${di+1} · ${label} · ต่อที่ ${si+1}${seg.type ? ' ' + typeCfg.label : ''}`;
        if(!seg.type || typeCfg.kind === 'placeholder'){ add(`${tag}: ยังไม่ได้เลือกวิธีการเดินทาง`, 'seg-' + sid, sid); return; }
        const needsRoute = (typeCfg.kind === 'rail' || typeCfg.kind === 'manual' || typeCfg.kind === 'car') && seg.type !== 'PARKING' && seg.type !== 'TOLL';
        if(needsRoute){
          if(!seg.origin) add(`${tag}: ยังไม่ได้กรอก${typeCfg.kind === 'rail' ? 'สถานี' : ''}ต้นทาง`, 'seg-' + sid, sid);
          else if(typeCfg.kind === 'rail' && !isValidStation(seg.type, seg.origin)) add(`${tag}: ชื่อสถานีต้นทางไม่ถูกต้อง`, 'seg-' + sid, sid);
          if(!seg.destination) add(`${tag}: ยังไม่ได้กรอก${typeCfg.kind === 'rail' ? 'สถานี' : ''}ปลายทาง`, 'seg-' + sid, sid);
          else if(typeCfg.kind === 'rail' && !isValidStation(seg.type, seg.destination)) add(`${tag}: ชื่อสถานีปลายทางไม่ถูกต้อง`, 'seg-' + sid, sid);
        }
        if(typeCfg.kind === 'car' && !(parseFloat(seg.distanceKm) > 0)) add(`${tag}: ยังไม่ได้กรอกระยะทาง`, 'seg-' + sid, sid);
        if(seg.type === 'OTHER' && !(seg.otherDescription || '').trim()) add(`${tag}: ยังไม่ได้ระบุประเภทการเดินทาง`, 'seg-' + sid, sid);
        if(typeCfg.kind !== 'none' && !(parseFloat(seg.amount) > 0)) add(`${tag}: ยังไม่ได้กรอกจำนวนเงิน`, 'seg-' + sid, sid);
        const requiresReceipt = seg.type === 'PARKING' || seg.type === 'TOLL' || seg.type === 'GRAB' || typeCfg.kind === 'car';
        if(requiresReceipt && !((seg.attachments || []).length > 0)) add(`${tag}: ยังไม่ได้แนบหลักฐาน`, 'seg-' + sid, sid);
        if((seg.attachments || []).some(a => a.isExisting && !a.base64)) add(`${tag}: รูปเดิมยังโหลดไม่เสร็จ รอสักครู่แล้วลองใหม่ (ถ้าไม่หาย ให้ลบแล้วแนบใหม่)`, 'seg-' + sid, sid);
      });
    });
  });

  const box = document.getElementById('validationBox');
  render();
  if(errors.length){
    box.innerHTML = bannerHtml('err', `<b>ยังส่งไม่ได้ — กรอกไม่ครบ ${errors.length} จุด</b><ul class="err-list">` +
      errors.slice(0, 12).map(e => `<li><a href="#${e.target}" onclick="jumpTo('${e.target}'); return false;">${esc(e.text)}</a></li>`).join('') +
      (errors.length > 12 ? `<li>…และอีก ${errors.length - 12} จุด</li>` : '') + '</ul>');
    box.scrollIntoView({ behavior:'smooth', block:'start' });
    return false;
  }
  box.innerHTML = '';
  return true;
}
function jumpTo(id){
  const el = document.getElementById(id); if(!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  const f = el.querySelector('input, button'); if(f) setTimeout(() => f.focus({ preventScroll:true }), 350);
}

function setActions(mode, detail){
  const area = document.getElementById('actionArea');
  const formArea = document.getElementById('formArea');
  formArea.classList.toggle('is-sending', mode === 'sending');
  if(mode === 'sending'){
    const step = detail === 1 ? ['กำลังสร้างเอกสาร PDF…', 'ขั้นที่ 1 จาก 2'] : ['กำลังส่งข้อมูลและไฟล์…', 'ขั้นที่ 2 จาก 2'];
    area.innerHTML = `<div class="actions" role="status"><div class="sending">${ICON.spin}<div><b>${step[0]}</b><div class="muted small">${step[1]} · อย่าปิดหน้านี้</div></div></div>
      <button type="button" class="btn btn-primary btn-lg" disabled>กำลังส่ง…</button></div>`;
  } else if(mode === 'fail'){
    area.innerHTML = `<div class="send-fail" role="alert">${bannerHtml('err', `<b>ส่งเอกสารไม่สำเร็จ</b> — ${esc(detail || 'เชื่อมต่อระบบไม่ได้ (อินเทอร์เน็ตหลุด หรือระบบกำลังบันทึกของคนอื่นอยู่)')}<br>ข้อมูลและไฟล์ที่กรอกยังอยู่ครบ ไม่ต้องกรอกใหม่`)}
      <div class="actions"><span class="muted">หรือ <a href="#" onclick="downloadPdf(); return false;">ดาวน์โหลด PDF เก็บไว้ก่อน</a></span>
      <button type="button" class="btn btn-primary btn-lg" onclick="submitForm()">ลองส่งอีกครั้ง</button></div></div>`;
  } else {
    area.innerHTML = `<div class="actions"><span class="muted">ดูตัวอย่างเอกสารก่อนส่ง: <a href="#" onclick="downloadPdf(); return false;">PDF</a> · <a href="#" onclick="downloadDocx(); return false;">Word</a></span>
      <button type="button" class="btn btn-primary btn-lg" id="submitFormBtn" onclick="submitForm()">ยืนยันส่งเอกสาร</button></div>`;
  }
}

async function downloadPdf(){
  if(!validate()) return;
  showMsg('ok', 'กำลังสร้าง PDF…');
  try{
    const doc = await generatePdfBlob();
    checkPdfSize(doc);
    doc.save(pdfFileName());
    document.getElementById('msgArea').innerHTML = '';
  }catch(err){ showMsg('err', 'สร้าง PDF ไม่สำเร็จ: ' + err); }
}
async function downloadDocx(){
  if(!validate()) return;
  showMsg('ok', 'กำลังสร้างไฟล์ Word…');
  try{
    const blob = await buildDocxBlob();
    saveBlob(blob, pdfFileName().replace(/\.pdf$/i, '.docx'));
    document.getElementById('msgArea').innerHTML = '';
  }catch(err){ showMsg('err', 'สร้างไฟล์ Word ไม่สำเร็จ: ' + (err && err.message ? err.message : err)); }
}

async function submitForm(){
  if(ui.sending) return;
  if(!validate()) return;
  ui.sending = true; comboClose(); ui.openTypeMenu = null;
  document.getElementById('msgArea').innerHTML = '';
  setActions('sending', 1);
  try{
    const total = updateTotals();
    const doc = await generatePdfBlob();
    checkPdfSize(doc);
    lastPdfDoc = doc;
    setActions('sending', 2);
    const payload = {
      eventId: EVENT_ID,
      employeeName: document.getElementById('employeeName').value.trim(),
      department: document.getElementById('department').value.trim(),
      totalAmount: Number(total.toFixed(2)),
      summaryText: buildSummaryText(total),
      pdfBase64: doc.output('datauristring').split(',')[1],
      pdfFileName: pdfFileName(),
      tripDetails: stripExistingBase64ForSubmit(daysToTripsArray(state.days))
    };
    const res = await callApi('submitExpense', payload);
    ui.sending = false;
    if(res && res.ok){
      ui.submittedSnap = formSnapshot();
      clearTimeout(ui.draftTimer);
      clearDraft();
      setActions('idle');
      const emp = employeeList.find(e => e.name === payload.employeeName); if(emp) emp.submitted = true;
      delete mySubPrefetch[payload.employeeName];
      try{ const c = JSON.parse(localStorage.getItem(INFO_KEY()) || 'null'); if(c){ (c.employees || []).forEach(e => { if(e.name === payload.employeeName) e.submitted = true; }); localStorage.setItem(INFO_KEY(), JSON.stringify(c)); } }catch(e){}
      const pdfName = pdfFileName();
      doc.save(pdfName);
      let docxOk = true;
      try{
        lastDocxBlob = await buildDocxBlob();
        setTimeout(() => saveBlob(lastDocxBlob, pdfName.replace(/\.pdf$/i, '.docx')), 600);
      }catch(e){ docxOk = false; console.error('Word export failed:', e); }
      showSuccess(payload, docxOk);
    } else if(res && res.code === 'CLOSED'){
      setActions('idle');
      showPageBanner('closed', res.error); lockAll();
      window.scrollTo({ top:0, behavior:'smooth' });
    } else {
      setActions('fail', res && res.error);
    }
  }catch(err){
    ui.sending = false;
    setActions('fail', String(err && err.message ? err.message : err));
  }
}

function showSuccess(payload, docxOk){
  const root = document.getElementById('modalRoot');
  const now = new Date();
  const stamp = now.toLocaleDateString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' ' + nowHHMM();
  root.innerHTML = `<div class="modal-overlay"><div class="modal success" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="success-mark" aria-hidden="true">✓</div>
    <h2 id="sTitle">ส่งเอกสารเรียบร้อย</h2>
    <dl class="kv"><dt>ผู้เบิก</dt><dd>${esc(payload.employeeName)}</dd><dt>ยอดรวม</dt><dd>${fmt(payload.totalAmount)} บาท</dd><dt>ส่งเมื่อ</dt><dd>${esc(stamp)}</dd></dl>
    <p class="muted small">ระบบดาวน์โหลดสำเนา PDF${docxOk ? ' และ Word' : ''} ลงเครื่องให้แล้ว${docxOk ? ' · ถ้าไม่เห็นไฟล์ Word เบราว์เซอร์อาจถามว่าอนุญาตให้ดาวน์โหลดหลายไฟล์ไหม ให้กดอนุญาต หรือกดปุ่มด้านล่าง' : ''}</p>
    <div class="modal-actions split">
      <button type="button" class="btn btn-outline" onclick="lastPdfDoc && lastPdfDoc.save(pdfFileName())">ดาวน์โหลด PDF อีกครั้ง</button>
      <button type="button" class="btn btn-outline" onclick="lastDocxBlob ? saveBlob(lastDocxBlob, pdfFileName().replace(/\\.pdf$/i, '.docx')) : downloadDocx()">ดาวน์โหลด Word${docxOk ? ' อีกครั้ง' : ''}</button>
    </div>
    <button type="button" class="btn btn-primary btn-block" onclick="document.getElementById('modalRoot').innerHTML=''">ปิด</button>
    <p class="muted small">แก้ไขภายหลังได้: เปิดลิงก์เดิมแล้วเลือกชื่อตัวเอง ระบบเก็บฉบับเก่าไว้ให้ผู้จัดงาน</p>
  </div></div>`;
  root.querySelector('.btn-primary').focus();
}

/* ---------- init ---------- */
const INFO_KEY = () => 'eetFormInfo:' + EVENT_ID;
let infoApplied = false;
function applyEventInfo(res, fromCache){
  const firstTime = !infoApplied; infoApplied = true;
  const oldFuel = JSON.stringify(eventFuelPrices || []);
  eventName = res.event.eventName;
  ui.closeAt = res.event.closeAt || '';
  ui.isClosed = !!res.event.isClosed || (!!ui.closeAt && new Date(ui.closeAt) <= new Date());
  employeeList = res.employees || [];
  eventFuelPrices = res.fuelPrices || [];
  renderEventLabel();
  if(ui.isClosed){ document.getElementById('pageBanner').innerHTML = ''; showPageBanner('closed'); lockAll(); return; }
  if(employeeList.length === 0){ showPageBanner('no-staff'); lockAll(); return; }
  if(ui.allLocked){ ui.allLocked = false; document.getElementById('pageBanner').innerHTML = ''; } // e.g. deadline was extended
  if(firstTime){ const draft = readDraft(); if(draft) showDraftBanner(draft); }
  applyLock();
  if(combo.input && combo.input.id === 'employeeName') comboRefresh();
  if(firstTime || JSON.stringify(eventFuelPrices) !== oldFuel){ refreshCarFaresAll(); if(ui.unlocked) render(); }
}
async function loadEventInfo(){
  if(!EVENT_ID){ showFatal('bad-link'); return; }
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(INFO_KEY()) || 'null'); }catch(e){}
  if(cached && cached.event) applyEventInfo(cached, true); else setLoading(true);
  let res;
  try{ res = await callApi('getEventInfo', { eventId: EVENT_ID }); }
  catch(err){ setLoading(false); if(!cached) showFatal('load-fail'); return; }
  setLoading(false);
  if(!res || !res.ok){ try{ localStorage.removeItem(INFO_KEY()); }catch(e){} showFatal('bad-link', res && res.error); return; }
  try{ localStorage.setItem(INFO_KEY(), JSON.stringify(res)); }catch(e){}
  applyEventInfo(res, false);
}

window.addEventListener('DOMContentLoaded', async () => {
  applyLock();
  setActions('idle');
  render();
  await loadEventInfo();
});


/* ---------- API CALL ---------- */
const API_ACTION_TO_FUNCTION = {
  getEventInfo: 'apiGetEventInfo',
  getFuelPrice: 'apiGetFuelPrice',
  getMySubmission: 'apiGetMySubmission',
  submitExpense: 'apiSubmitExpense',
  // These three were added in later rounds (fuel-receipt lazy-loading,
  // existing-attachment lazy-loading) but never registered here. Since
  // callApi() only uses the google.script.run bridge when fnName is
  // truthy, a missing entry silently falls through to a plain fetch()
  // call instead — which fails when this page is served through Apps
  // Script's own HtmlService (a sandboxed iframe whose CSP blocks
  // cross-origin fetch() to script.google.com), even though
  // google.script.run itself would have worked fine. This is the most
  // likely cause of "the fuel receipt image never loads": the call was
  // silently taking the wrong transport and failing every time.
  getFuelReceiptImages: 'apiGetFuelReceiptImages',
  getSubmissionAttachmentImages: 'apiGetSubmissionAttachmentImages',
  getFileBase64: 'apiGetFileAsBase64'
};

function callApi(action, payload){
  const fnName = API_ACTION_TO_FUNCTION[action];
  if(typeof google !== 'undefined' && google.script && google.script.run && fnName){
    return new Promise((resolve, reject)=>{
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err=>reject(err))
        [fnName](payload);
    });
  }
  return fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({ action: action, payload: payload })
  }).then(res => res.json());
}
